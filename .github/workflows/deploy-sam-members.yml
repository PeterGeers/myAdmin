name: Deploy SAM Members
# Deploys the Members module to the nonprofit/data account (506221081911, eu-west-1)
# via GitHub OIDC. Stack name is deliberately NOT `h-dcn`: the Members module is its own
# CloudFormation stack, independent of the existing h-dcn app in the same account.
#
# BRANCH -> ENVIRONMENT MAPPING (test-environment spec, Req 23 — Branch_Environment_Mapping):
#   * push to `test` branch  -> `sam deploy --config-env test` -> stack `test_sam-members`
#   * push to `main` branch  -> `sam deploy --config-env prod` -> stack `sam-members`
# This CI mapping is deliberately separate from the application source, so it can evolve
# without changing the spec (Req 23.5). The per-env stack name, region, capabilities, and
# parameter_overrides live in `sam/members/samconfig.toml` ([test] / [prod]); this workflow
# only picks the config-env, so CI and a manual `sam deploy --config-env <env>` produce the
# SAME stack. NO stored secrets: auth is short-lived STS via NonprofitDeployRole's OIDC
# trust. The Cognito identifiers in samconfig are PUBLIC.
#
# OIDC PREREQUISITE: NonprofitDeployRole's trust policy must allow BOTH refs
# `repo:PeterGeers/myAdmin:ref:refs/heads/main` AND `.../refs/heads/test` (and, for a
# dispatch run from a feature branch, that branch's ref). Widening the trust is a one-time
# live-IAM step done out of band — this workflow cannot grant itself trust.

on:
  push:
    branches: [main, test]
    paths:
      - "sam/members/**"
      - "sam/shared/**"
      - ".github/workflows/deploy-sam-members.yml"
  workflow_dispatch:
    # Manual trigger (first deploy, or a re-deploy without a code change). Pick the
    # environment explicitly; defaults to test so a mis-click never hits production.
    inputs:
      config_env:
        description: "Which environment to deploy (test | prod)"
        required: true
        default: test
        type: choice
        options:
          - test
          - prod

permissions:
  id-token: write
  contents: read

# Never run two Members deploys against the same stack at once.
concurrency:
  group: sam-members-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Members (SAM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # Resolve the samconfig env from the branch (push) or the dispatch input:
      #   refs/heads/test -> test ; refs/heads/main -> prod ; workflow_dispatch -> input.
      - name: Resolve config-env
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CONFIG_ENV="${{ github.event.inputs.config_env }}"
          elif [ "${{ github.ref }}" = "refs/heads/test" ]; then
            CONFIG_ENV="test"
          else
            CONFIG_ENV="prod"
          fi
          echo "config_env=$CONFIG_ENV" >> "$GITHUB_OUTPUT"
          echo "Deploying members with --config-env $CONFIG_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # One-time prerequisite: NonprofitDeployRole's OIDC trust must allow the main
          # AND test branch refs (repo:PeterGeers/myAdmin:ref:refs/heads/{main,test}).
          role-to-assume: arn:aws:iam::506221081911:role/NonprofitDeployRole
          aws-region: eu-west-1

      # `sam build` builds the MembersLayer via its Makefile (vendors sam/shared +
      # sam/members, pip-installs the shared auth deps). rsync is preinstalled on
      # ubuntu-latest; sam + python are set up above.
      - name: SAM Build
        working-directory: sam/members
        run: sam build

      # All deploy parameters come from samconfig.toml [<config-env>]: stack_name
      # (test_sam-members / sam-members), region, capabilities, and the parameter_overrides
      # (Stage, MembersTableName, GovernanceProjectionTableName, the Cognito pool ARN/
      # registry, etc.) — the test/prod split lives entirely in samconfig, not here.
      - name: SAM Deploy
        working-directory: sam/members
        run: sam deploy --config-env ${{ steps.env.outputs.config_env }} --no-confirm-changeset --no-fail-on-empty-changeset

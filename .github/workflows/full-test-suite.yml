name: Full Test Suite

on:
  schedule:
    # Target ~02:00 Europe/Amsterdam (CET, UTC+1) / ~03:00 during CEST (UTC+2).
    # GitHub cron has no timezone/DST support, and it schedules on a best-effort
    # basis: crons at the top of the hour (minute 0) sit in the busiest queue slot
    # and are routinely delayed by hours. We observed the old "0 1" firing ~5h late
    # (05:40-06:22 UTC) every night. Use an off-the-hour minute to cut that queue
    # delay. Note: this reduces but cannot guarantee against GitHub's scheduling lag.
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which plane(s) to run"
        required: true
        default: "all"
        type: choice
        options:
          - all # backend + sam + frontend (everything)
          - backend # backend Flask plane only (lint + tests) — NOT sam
          - sam # SAM module plane only (tests + report-only lint)
          - frontend # frontend only (tests + report-only lint/typecheck)

# Least-privilege default (resolves actions/missing-workflow-permissions ×4).
# Every job here only checks out the repo and uploads artifacts via
# actions/upload-artifact@v4 — neither needs more than read access to repo
# contents. upload-artifact does NOT require a write permission. No job comments
# on PRs, writes checks/statuses, or uses OIDC (id-token) — OIDC deploy lives in
# the separate deploy-*.yml workflows. So a single restrictive default covers all
# four jobs with no per-job widening.
permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint & Static Analysis
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'backend' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          # ruff pin MUST match backend/requirements-test.txt (the canonical source).
          # Bump both together, deliberately — a floating ruff can turn lint red overnight.
          pip install ruff==0.16.5 vulture

      - name: Create reports directory
        working-directory: backend
        run: mkdir -p reports/lint

      # DB abstraction guards (AST static analysis, stdlib-only). Run from the repo
      # root because both scripts resolve their scan paths relative to '.'
      # (they scan backend/src etc.). Authoritative, non-bypassable gate: a stray
      # mysql.connector import or a new raw get_connection() assignment fails the job.
      - name: DB abstraction guards
        working-directory: .
        run: |
          python backend/scripts/check_db_imports.py
          python backend/scripts/check_raw_connection.py

      - name: Ruff lint
        working-directory: backend
        run: |
          echo "## Ruff Lint Report" > reports/lint/ruff-lint.md
          echo "" >> reports/lint/ruff-lint.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/lint/ruff-lint.md
          echo "Ruff version: $(ruff --version)" >> reports/lint/ruff-lint.md
          echo "" >> reports/lint/ruff-lint.md
          ruff check src/ --exclude src/validate_pattern/ --output-format=concise > reports/lint/ruff-errors.txt 2>&1 || true
          if [ -s reports/lint/ruff-errors.txt ] && ! grep -q "^All checks passed" reports/lint/ruff-errors.txt; then
            echo "### Summary by Rule" >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
            cat reports/lint/ruff-errors.txt | grep -oP ':\s+\K[A-Z]+[0-9]+' | sort | uniq -c | sort -rn >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
            echo "" >> reports/lint/ruff-lint.md
            echo "### Total Errors" >> reports/lint/ruff-lint.md
            # Count only real diagnostic lines (path:line:col:) — ruff's concise
            # output appends a "Found N errors." summary + a "[*] N fixable" hint
            # line that wc -l wrongly included (the 41-vs-39 off-by-two). This now
            # matches the per-rule table above, which already filters to diagnostics.
            TOTAL=$(grep -cP '^\S+:\d+:\d+:' reports/lint/ruff-errors.txt)
            echo "Found $TOTAL errors" >> reports/lint/ruff-lint.md
            echo "" >> reports/lint/ruff-lint.md
            echo "### All Errors" >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
            cat reports/lint/ruff-errors.txt >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
          else
            echo "✅ All checks passed!" >> reports/lint/ruff-lint.md
          fi
          # Run again with github format for annotations
          ruff check src/ --exclude src/validate_pattern/ --output-format=github

      - name: Ruff format check
        if: always()
        working-directory: backend
        run: |
          echo "## Ruff Format Report" > reports/lint/ruff-format.md
          echo "" >> reports/lint/ruff-format.md
          ruff format --check src/ --exclude src/validate_pattern/ > reports/lint/ruff-format-output.txt 2>&1 || true
          if grep -q "would be reformatted" reports/lint/ruff-format-output.txt; then
            echo "### Files needing reformatting" >> reports/lint/ruff-format.md
            echo '```' >> reports/lint/ruff-format.md
            grep "would be reformatted" reports/lint/ruff-format-output.txt >> reports/lint/ruff-format.md
            echo '```' >> reports/lint/ruff-format.md
            # Fail the step
            ruff format --check src/ --exclude src/validate_pattern/
          else
            echo "✅ All files already formatted!" >> reports/lint/ruff-format.md
          fi

      - name: Vulture dead code check
        if: always()
        working-directory: backend
        run: |
          echo "## Vulture Dead Code Report" > reports/lint/vulture.md
          echo "" >> reports/lint/vulture.md
          vulture src/ vulture_whitelist.py --min-confidence 80 --exclude validate_pattern/ > reports/lint/vulture-output.txt 2>&1 || true
          if [ -s reports/lint/vulture-output.txt ]; then
            echo "### Dead Code Found" >> reports/lint/vulture.md
            echo '```' >> reports/lint/vulture.md
            cat reports/lint/vulture-output.txt >> reports/lint/vulture.md
            echo '```' >> reports/lint/vulture.md
            # Fail the step
            vulture src/ vulture_whitelist.py --min-confidence 80 --exclude validate_pattern/
          else
            echo "✅ No dead code found!" >> reports/lint/vulture.md
          fi

      - name: Generate lint summary
        if: always()
        working-directory: backend
        run: |
          echo "## Backend Lint & Static Analysis Summary" > reports/lint/SUMMARY.md
          echo "" >> reports/lint/SUMMARY.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/lint/SUMMARY.md
          echo "Ruff version: $(ruff --version)" >> reports/lint/SUMMARY.md
          echo "" >> reports/lint/SUMMARY.md
          echo "| Check | Result |" >> reports/lint/SUMMARY.md
          echo "|-------|--------|" >> reports/lint/SUMMARY.md
          if grep -q "All checks passed" reports/lint/ruff-lint.md 2>/dev/null; then
            echo "| Ruff Lint | ✅ Pass |" >> reports/lint/SUMMARY.md
          else
            echo "| Ruff Lint | ❌ Fail |" >> reports/lint/SUMMARY.md
          fi
          if grep -q "All files already formatted" reports/lint/ruff-format.md 2>/dev/null; then
            echo "| Ruff Format | ✅ Pass |" >> reports/lint/SUMMARY.md
          else
            echo "| Ruff Format | ❌ Fail |" >> reports/lint/SUMMARY.md
          fi
          if grep -q "No dead code found" reports/lint/vulture.md 2>/dev/null; then
            echo "| Vulture | ✅ Pass |" >> reports/lint/SUMMARY.md
          else
            echo "| Vulture | ❌ Fail |" >> reports/lint/SUMMARY.md
          fi

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-reports
          path: backend/reports/lint/
          retention-days: 30

  backend-tests:
    name: Backend Full Test Suite
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'backend' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-cov pytest-html

      - name: Run all unit tests
        working-directory: backend
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pytest tests/unit/ \
            --tb=short -q \
            --cov=src --cov-report=html:reports/coverage-html --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/junit-results.xml \
            --html=reports/test-report.html --self-contained-html \
            2>&1 | tee reports/test-output.txt
        env:
          TESTING: "true"
          DB_HOST: "localhost"
          DB_USER: "test"
          DB_PASSWORD: "test"
          DB_NAME: "test"

      - name: Generate summary
        if: always()
        working-directory: backend
        run: |
          mkdir -p reports
          echo "## Backend Test Results" > reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          # Extract pass/fail counts from output
          if [ -f reports/test-output.txt ]; then
            tail -5 reports/test-output.txt >> reports/SUMMARY.md
          else
            echo "No test output file found" >> reports/SUMMARY.md
          fi

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/
          retention-days: 30

  sam-tests:
    name: SAM Module-Plane Test Suite
    runs-on: ubuntu-latest
    # Runs on the nightly schedule, on scope `all`, or on the dedicated `sam`
    # scope. NOTE: scope `backend` no longer runs SAM — the module plane is
    # separately selectable (use `sam`, or `all` for everything).
    if: ${{ github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'sam' }}
    # Local DynamoDB for the Phase-1 invariant E2E suite (sam/tests/e2e, spec 03
    # "config-fields-foolproof-crud" R11.3 / design C5). The e2e fixtures target the
    # `amazon/dynamodb-local` container (steering 42) and SKIP cleanly when
    # AWS_ENDPOINT_URL_DYNAMODB is unset — so running them in this gated job is what
    # makes the invariant harness ACTUALLY RUN (not skip). An ungated/skipped test is
    # exactly how the original truncation regression reached `main`; gating it here in
    # the REQUIRED nightly suite closes that hole (R11.3). This uses no AWS creds and
    # no OIDC — the emulator is offline, signed with dummy creds (steering 43: no
    # secrets in CI; the deploy workflows own OIDC). Per-PR is not wired because the
    # per-run container is heavy; the design (Risks: "Local-DynamoDB in CI") accepts
    # nightly as the required gate.
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          # Map the container's 8000 to host 8000 so the e2e conftest endpoint
          # (http://localhost:8000, steering 42) reaches the emulator from the job.
          - 8000:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sam/shared/requirements.txt

      - name: Install dependencies
        working-directory: sam
        run: |
          pip install -r shared/requirements.txt
          # boto3 is provided by the AWS Lambda runtime by default (so it is not in
          # shared/requirements.txt, the ship-to-Lambda layer manifest), but the CI
          # test runner does NOT get Lambda's bundled boto3. The SAM handlers import
          # services.dynamodb_client (-> boto3), so install it explicitly here.
          # Pinned to match backend/requirements.txt.
          pip install boto3==1.42.30
          # ruff pin MUST match backend/requirements-test.txt (canonical). Used for the
          # REPORT-ONLY SAM lint below — SAM shares the backend ruff policy (backend/ruff.toml).
          # pyyaml is TEST-ONLY (the *_env_stack_contract.py tests parse template.yaml);
          # it is NOT a Lambda runtime dep, so it lives here and NOT in shared/requirements.txt.
          pip install pytest pytest-html hypothesis pyyaml==6.0.2 ruff==0.16.5

      # SAM config#fields CRUD guard (spec 03 "config-fields-foolproof-crud" R11.2;
      # steering 39 → Enforcement). The SAM / DynamoDB counterpart to the backend-lint
      # job's "DB abstraction guards" step: AST static analysis (stdlib-only) that fails
      # the job on (a) a raw governance-table put_item/update_item/delete_item OUTSIDE the
      # sanctioned Change-Op write repository (+ the C6 migration), or (b) a raw storage-
      # shape key (field_overlay/overrides/fixed_overrides/dotted {group}.{key}) in an API
      # response. Run from the repo root (the guard resolves its scan path 'sam' relative
      # to '.'). Authoritative, non-bypassable, BLOCKING gate: the baseline tree is clean,
      # so a NEW raw-write bypass / raw-shape response fails this required nightly suite —
      # closing the hole an ungated check left (R11.2). A sanctioned new write site is a
      # reviewed allow-list addition in the guard, never a suppression.
      - name: SAM config#fields CRUD guard
        working-directory: .
        run: python scripts/check_sam_config_crud.py

      - name: Run all SAM tests
        working-directory: sam
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pytest \
            --continue-on-collection-errors \
            --tb=short -q \
            --junitxml=reports/junit-results.xml \
            --html=reports/test-report.html --self-contained-html \
            2>&1 | tee reports/test-output.txt
        env:
          # Point the e2e invariant harness (sam/tests/e2e/conftest.py) at the
          # dynamodb-local service container above. Setting this var is the SIGNAL the
          # conftest uses: when it is set AND the endpoint answers, the invariant tests
          # RUN; when it is unset they SKIP (a plain local unit run is unaffected). So
          # these two env lines are what flip the gated suite from "skipped" to "run"
          # (spec 03 R11.3). The region + dummy table name mirror the harness defaults
          # (steering 42); dummy AWS creds let botocore sign — local DynamoDB ignores
          # the signature and never reaches real AWS (steering 43: no real secrets).
          AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8000
          AWS_REGION: eu-west-1
          GOVERNANCE_PROJECTION_TABLE: e2e_config_fields_projection
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_SESSION_TOKEN: local

      # REPORT-ONLY (non-blocking): SAM has never been ruff-linted. Surface the
      # backlog as an artifact without failing the job. Flip to blocking in a
      # follow-up once the findings are cleaned up. Uses the shared backend ruff
      # policy so SAM and the Flask plane stay consistent.
      - name: Ruff lint (SAM, report-only)
        if: always()
        working-directory: sam
        run: |
          mkdir -p reports/lint
          echo "## SAM Ruff Lint Report (REPORT-ONLY — non-blocking)" > reports/lint/ruff-lint.md
          echo "" >> reports/lint/ruff-lint.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/lint/ruff-lint.md
          echo "Ruff version: $(ruff --version)" >> reports/lint/ruff-lint.md
          echo "Config: backend/ruff.toml (shared policy)" >> reports/lint/ruff-lint.md
          echo "" >> reports/lint/ruff-lint.md
          ruff check . --config ../backend/ruff.toml --output-format=concise > reports/lint/ruff-errors.txt 2>&1 || true
          if [ -s reports/lint/ruff-errors.txt ] && ! grep -q "^All checks passed" reports/lint/ruff-errors.txt; then
            echo "### Summary by Rule" >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
            grep -oP ':\s+\K[A-Z]+[0-9]+' reports/lint/ruff-errors.txt | sort | uniq -c | sort -rn >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
            echo "" >> reports/lint/ruff-lint.md
            echo "Total findings: $(wc -l < reports/lint/ruff-errors.txt)" >> reports/lint/ruff-lint.md
          else
            echo "✅ No ruff findings." >> reports/lint/ruff-lint.md
          fi
          # Report-only: never fail the step.
          ruff format --check . --config ../backend/ruff.toml > reports/lint/ruff-format-output.txt 2>&1 || true

      - name: Generate summary
        if: always()
        working-directory: sam
        run: |
          mkdir -p reports
          echo "## SAM Module-Plane Test Results" > reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          if [ -f reports/test-output.txt ]; then
            tail -5 reports/test-output.txt >> reports/SUMMARY.md
          else
            echo "No test output file found" >> reports/SUMMARY.md
          fi

      - name: Upload SAM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-test-reports
          path: sam/reports/
          retention-days: 30

  frontend-tests:
    name: Frontend Full Test Suite
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.scope == 'all' || inputs.scope == 'frontend' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run all tests
        working-directory: frontend
        run: |
          set -o pipefail
          mkdir -p reports
          npx vitest run --reporter=verbose --reporter=junit --outputFile=reports/junit-results.xml \
            2>&1 | tee reports/test-output.txt
        env:
          # V8 old-space budget for the whole frontend test run. vitest's forks
          # workers INHERIT this NODE_OPTIONS (vitest does not forward a custom
          # execArgv to workers, so NODE_OPTIONS is the supported way to raise the
          # worker heap), and it also covers the heavy main process (the 2026-10-13
          # run spent import 368s / transform 20s there). 6 GB gives the reused
          # worker headroom above the cross-file accumulation that OOM'd the default
          # ceiling; isolate:true + maxForks in vite.config.ts bound how fast it
          # grows. Raise this deliberately as the suite grows (ubuntu-latest has 16 GB).
          NODE_OPTIONS: "--max-old-space-size=6144"
          VITE_API_URL: http://localhost:5000
          VITE_COGNITO_USER_POOL_ID: eu-west-1_TestPool123
          VITE_COGNITO_CLIENT_ID: test-client-id
          VITE_COGNITO_DOMAIN: test.auth.eu-west-1.amazoncognito.com
          VITE_AWS_REGION: eu-west-1
          VITE_REDIRECT_SIGN_IN: http://localhost:3000/
          VITE_REDIRECT_SIGN_OUT: http://localhost:3000/
          VITE_DOCS_URL: /docs

      # REPORT-ONLY (non-blocking): the frontend has no CI eslint/typecheck gate
      # yet. Surface findings as an artifact without failing the job; flip to
      # blocking in a follow-up once clean.
      - name: ESLint (report-only)
        if: always()
        working-directory: frontend
        run: |
          mkdir -p reports/lint
          echo "## Frontend ESLint Report (REPORT-ONLY — non-blocking)" > reports/lint/eslint.md
          echo "" >> reports/lint/eslint.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/lint/eslint.md
          echo "" >> reports/lint/eslint.md
          echo '```' >> reports/lint/eslint.md
          npx eslint src >> reports/lint/eslint.md 2>&1 || true
          echo '```' >> reports/lint/eslint.md

      - name: TypeScript typecheck (tsc --noEmit, report-only)
        if: always()
        working-directory: frontend
        run: |
          mkdir -p reports/lint
          echo "## Frontend TypeScript Typecheck (REPORT-ONLY — non-blocking)" > reports/lint/tsc.md
          echo "" >> reports/lint/tsc.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/lint/tsc.md
          echo "tsc version: $(npx tsc --version)" >> reports/lint/tsc.md
          echo "" >> reports/lint/tsc.md
          echo '```' >> reports/lint/tsc.md
          # tsconfig.json already sets noEmit; -p keeps the same include/paths as the build.
          npx tsc --noEmit -p tsconfig.json >> reports/lint/tsc.md 2>&1 || true
          echo '```' >> reports/lint/tsc.md

      - name: Generate summary
        if: always()
        working-directory: frontend
        run: |
          mkdir -p reports
          echo "## Frontend Test Results" > reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          if [ -f reports/test-output.txt ]; then
            tail -10 reports/test-output.txt >> reports/SUMMARY.md
          else
            echo "No test output file found" >> reports/SUMMARY.md
          fi

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend/reports/
          retention-days: 30

name: Full Test Suite

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which tests to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - backend
          - frontend

jobs:
  backend-lint:
    name: Backend Lint & Static Analysis
    runs-on: ubuntu-latest
    if: ${{ inputs.scope == 'both' || inputs.scope == 'backend' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff vulture

      - name: Create reports directory
        working-directory: backend
        run: mkdir -p reports/lint

      - name: Ruff lint
        working-directory: backend
        run: |
          echo "## Ruff Lint Report" > reports/lint/ruff-lint.md
          echo "" >> reports/lint/ruff-lint.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/lint/ruff-lint.md
          echo "Ruff version: $(ruff --version)" >> reports/lint/ruff-lint.md
          echo "" >> reports/lint/ruff-lint.md
          ruff check src/ --exclude src/validate_pattern/ --output-format=concise > reports/lint/ruff-errors.txt 2>&1 || true
          if [ -s reports/lint/ruff-errors.txt ] && ! grep -q "^All checks passed" reports/lint/ruff-errors.txt; then
            echo "### Summary by Rule" >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
            cat reports/lint/ruff-errors.txt | grep -oP ':\s+\K[A-Z]+[0-9]+' | sort | uniq -c | sort -rn >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
            echo "" >> reports/lint/ruff-lint.md
            echo "### Total Errors" >> reports/lint/ruff-lint.md
            TOTAL=$(wc -l < reports/lint/ruff-errors.txt)
            echo "Found $TOTAL errors" >> reports/lint/ruff-lint.md
            echo "" >> reports/lint/ruff-lint.md
            echo "### All Errors" >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
            cat reports/lint/ruff-errors.txt >> reports/lint/ruff-lint.md
            echo '```' >> reports/lint/ruff-lint.md
          else
            echo "✅ All checks passed!" >> reports/lint/ruff-lint.md
          fi
          # Run again with github format for annotations
          ruff check src/ --exclude src/validate_pattern/ --output-format=github

      - name: Ruff format check
        if: always()
        working-directory: backend
        run: |
          echo "## Ruff Format Report" > reports/lint/ruff-format.md
          echo "" >> reports/lint/ruff-format.md
          ruff format --check src/ --exclude src/validate_pattern/ > reports/lint/ruff-format-output.txt 2>&1 || true
          if grep -q "would be reformatted" reports/lint/ruff-format-output.txt; then
            echo "### Files needing reformatting" >> reports/lint/ruff-format.md
            echo '```' >> reports/lint/ruff-format.md
            grep "would be reformatted" reports/lint/ruff-format-output.txt >> reports/lint/ruff-format.md
            echo '```' >> reports/lint/ruff-format.md
            # Fail the step
            ruff format --check src/ --exclude src/validate_pattern/
          else
            echo "✅ All files already formatted!" >> reports/lint/ruff-format.md
          fi

      - name: Vulture dead code check
        if: always()
        working-directory: backend
        run: |
          echo "## Vulture Dead Code Report" > reports/lint/vulture.md
          echo "" >> reports/lint/vulture.md
          vulture src/ vulture_whitelist.py --min-confidence 80 --exclude validate_pattern/ > reports/lint/vulture-output.txt 2>&1 || true
          if [ -s reports/lint/vulture-output.txt ]; then
            echo "### Dead Code Found" >> reports/lint/vulture.md
            echo '```' >> reports/lint/vulture.md
            cat reports/lint/vulture-output.txt >> reports/lint/vulture.md
            echo '```' >> reports/lint/vulture.md
            # Fail the step
            vulture src/ vulture_whitelist.py --min-confidence 80 --exclude validate_pattern/
          else
            echo "✅ No dead code found!" >> reports/lint/vulture.md
          fi

      - name: Generate lint summary
        if: always()
        working-directory: backend
        run: |
          echo "## Backend Lint & Static Analysis Summary" > reports/lint/SUMMARY.md
          echo "" >> reports/lint/SUMMARY.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/lint/SUMMARY.md
          echo "Ruff version: $(ruff --version)" >> reports/lint/SUMMARY.md
          echo "" >> reports/lint/SUMMARY.md
          echo "| Check | Result |" >> reports/lint/SUMMARY.md
          echo "|-------|--------|" >> reports/lint/SUMMARY.md
          if grep -q "All checks passed" reports/lint/ruff-lint.md 2>/dev/null; then
            echo "| Ruff Lint | ✅ Pass |" >> reports/lint/SUMMARY.md
          else
            echo "| Ruff Lint | ❌ Fail |" >> reports/lint/SUMMARY.md
          fi
          if grep -q "All files already formatted" reports/lint/ruff-format.md 2>/dev/null; then
            echo "| Ruff Format | ✅ Pass |" >> reports/lint/SUMMARY.md
          else
            echo "| Ruff Format | ❌ Fail |" >> reports/lint/SUMMARY.md
          fi
          if grep -q "No dead code found" reports/lint/vulture.md 2>/dev/null; then
            echo "| Vulture | ✅ Pass |" >> reports/lint/SUMMARY.md
          else
            echo "| Vulture | ❌ Fail |" >> reports/lint/SUMMARY.md
          fi

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-reports
          path: backend/reports/lint/
          retention-days: 30

  backend-tests:
    name: Backend Full Test Suite
    runs-on: ubuntu-latest
    if: ${{ inputs.scope == 'both' || inputs.scope == 'backend' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest-cov pytest-html

      - name: Run all unit tests
        working-directory: backend
        run: |
          mkdir -p reports
          python -m pytest tests/unit/ \
            --tb=short -q \
            --cov=src --cov-report=html:reports/coverage-html --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/junit-results.xml \
            --html=reports/test-report.html --self-contained-html \
            2>&1 | tee reports/test-output.txt || true
        env:
          TESTING: "true"
          DB_HOST: "localhost"
          DB_USER: "test"
          DB_PASSWORD: "test"
          DB_NAME: "test"

      - name: Generate summary
        if: always()
        working-directory: backend
        run: |
          mkdir -p reports
          echo "## Backend Test Results" > reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          # Extract pass/fail counts from output
          if [ -f reports/test-output.txt ]; then
            tail -5 reports/test-output.txt >> reports/SUMMARY.md
          else
            echo "No test output file found" >> reports/SUMMARY.md
          fi

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/
          retention-days: 30

  frontend-tests:
    name: Frontend Full Test Suite
    runs-on: ubuntu-latest
    if: ${{ inputs.scope == 'both' || inputs.scope == 'frontend' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run all tests
        working-directory: frontend
        run: |
          mkdir -p reports
          npx vitest run --reporter=verbose --reporter=junit --outputFile=reports/junit-results.xml \
            2>&1 | tee reports/test-output.txt || true
        env:
          VITE_API_URL: http://localhost:5000
          VITE_COGNITO_USER_POOL_ID: eu-west-1_TestPool123
          VITE_COGNITO_CLIENT_ID: test-client-id
          VITE_COGNITO_DOMAIN: test.auth.eu-west-1.amazoncognito.com
          VITE_AWS_REGION: eu-west-1
          VITE_REDIRECT_SIGN_IN: http://localhost:3000/
          VITE_REDIRECT_SIGN_OUT: http://localhost:3000/
          VITE_DOCS_URL: /docs

      - name: Generate summary
        if: always()
        working-directory: frontend
        run: |
          mkdir -p reports
          echo "## Frontend Test Results" > reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          echo "Run date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> reports/SUMMARY.md
          echo "" >> reports/SUMMARY.md
          if [ -f reports/test-output.txt ]; then
            tail -10 reports/test-output.txt >> reports/SUMMARY.md
          else
            echo "No test output file found" >> reports/SUMMARY.md
          fi

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend/reports/
          retention-days: 30

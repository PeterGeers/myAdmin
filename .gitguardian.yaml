# GitGuardian Configuration for myAdmin
# https://docs.gitguardian.com/ggshield-docs/reference/configuration

version: 2

# Secret detection settings
secret:
  # Don't show actual secret values in output (security)
  show_secrets: false

  # Paths to exclude from scanning
  ignored_paths:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/build/**"
    - "**/dist/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/mysql_data/**"
    - "**/logs/**"
    - "**/.pytest_cache/**"
    - "**/.hypothesis/**"
    - "**/tests/**"
    - "**/__tests__/**"
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/coverage/**"
    - "**/*.log"
    - "**/terraform.tfstate*"
    - "**/.terraform/**"
    - "**/*.example"
    - "**/*-example.*"
    # h-dcn backfill operator script: its docstring shows run-commands with
    # `env -u AWS_SECRET_ACCESS_KEY ...` (env-var NAMES being unset, no values)
    # and a <SPREADSHEET_ID> placeholder — GitGuardian "Generic CLI Secret"
    # false positive (incident 37743385). The companion test file
    # (sam/tests/test_hdcn_backfill.py) is already covered by **/tests/** above.
    # No real credential is present in either file.
    - "scripts/aws/backfill-hdcn-members.py"

  # Ignore known test/placeholder secrets
  ignored_matches:
    - name: "Test API Keys"
      match: "sk-test-"
    - name: "OpenRouter fake/placeholder keys"
      match: "sk-or-v1-.*(?:abc123|your-|<your-|new-key-here|a1b2c3d4)"
    - name: "Example placeholders"
      match: "your-.*-here"
    - name: "Placeholder values"
      match: "REPLACE_ME|YOUR_.*|EXAMPLE_.*"
    - name: "Localhost URLs"
      match: "http://localhost"

# Exit with error code if secrets found (fail the commit)
exit_zero: false

# Verbose output for debugging
verbose: false

# Maximum commits to scan in pre-commit hook
max_commits_for_hook: 50

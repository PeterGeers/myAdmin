AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

# =============================================================================
# Members SAM app — one Lambda, one layer (S5b C11, task 1.1)
# =============================================================================
# The consolidated one-Lambda Members module (the S5 verified-auth edge
# `sam/members/handler/app.py`) as a SAM app that BUILDS (`sam build`) and RUNS
# (`sam local start-api`). It mirrors the S-plane Lambda-layer pattern
# (`35-sam-module-architecture-sam.md`) but with exactly ONE Lambda.
#
# Discipline (per requirements R6 + steering 23-aws-accounts.md):
#   * Every table/region env var is resolved FAIL-FAST — no dangerous defaults.
#     A missing value must break the deploy loudly, never silently point at the
#     wrong table or at production. So `MembersTableName` / `GovernanceProjectionTableName`
#     / `Region` are parameters WITHOUT defaults.
#   * The `sam-members` and `governance_projection` DynamoDB tables are NOT
#     resources in this template — they are managed-outside-CFN / retained
#     (23-aws-accounts.md). The template only REFERENCES their names via env vars.
#   * There is NO `MEMBERS_PILOT_ROUTING` env var. The pilot-routing gate is
#     dropped entirely (S5b): access is capability (token) + scope grant
#     (projection).
#   * `AWS_ENDPOINT_URL_DYNAMODB` is LOCAL-ONLY. It is not declared here (no
#     dangerous prod default); `sam local start-api` injects it via its env-vars
#     JSON file (task 1.3), and boto3 only overrides the endpoint when it is set
#     (`services/dynamodb_client.py`).
#
# -----------------------------------------------------------------------------
# BUILD (task 1.2, R6.3 — verified building the function + layer)
# -----------------------------------------------------------------------------
# Build both resources (MembersLayer + MembersFunction) from THIS directory:
#
#     cd sam/members && sam build
#
# `sam build` stages the layer under `sam/members/.aws-sam/build/MembersLayer/`
# (a DESCENDANT of `sam/members`), so the layer Makefile vendors `sam/shared` +
# `sam/members` with `rsync -a --exclude '.aws-sam' --exclude '__pycache__'
# --exclude 'tests'` (NOT `cp -r`) to skip the build tree and avoid the
# `cp: cannot copy a directory into itself` error. The source tree is only read,
# never mutated. Requires `sam`, `rsync`, and `python` (with pip) on PATH; the
# layer build pip-installs the shared auth deps (PyJWT / cryptography / requests)
# from `sam/shared/requirements.txt`. On success `sam build` prints
# `Build Succeeded` and both `MembersLayer/` and `MembersFunction/` appear under
# `.aws-sam/build/`. Next: `sam local start-api` (task 1.3).
# =============================================================================

Description: >-
  Members module (S5b): one Lambda (verified-auth edge) + one layer vendoring
  sam/shared + sam/members + the shared dynamodb_client, behind an ANY /{proxy+}
  API. Tables are managed outside this template (retain).

Parameters:
  MembersTableName:
    Type: String
    Description: >-
      Name of the module-plane Members DynamoDB table (e.g. `sam-members` in prod,
      `sam-members-local` locally). Managed outside this template. No default —
      fail-fast (23-aws-accounts.md).
    AllowedPattern: "^sam-members.*$"
    ConstraintDescription: Must start with `sam-members` (SAM-plane `sam-` prefix, env as a suffix).

  GovernanceProjectionTableName:
    Type: String
    Description: >-
      Name of the governance projection DynamoDB table the module READS config /
      scope grants from (carries its own env prefix, e.g. `governance_projection`
      or `local_governance_projection`). Managed outside this template. No default —
      fail-fast.

  Region:
    Type: String
    Description: >-
      AWS region for the module (eu-west-1). Surfaced as the `AWS_REGION` runtime
      env var the fail-fast dynamodb_client requires. No default — fail-fast.
    AllowedValues:
      - eu-west-1

  Stage:
    Type: String
    Description: >-
      Deployment stage — names the API stage + resources (`members-<stage>`) and the
      output URL. The runnable phase is `local` (`sam local start-api`); `prod` is the
      later gated deploy.
    Default: local
    AllowedValues:
      - local
      - prod

  CognitoUserPoolArn:
    Type: String
    Description: >-
      ARN of the Cognito user pool that fronts the API (R6.1 — Cognito authorizer in
      prod). Supply the real pool ARN at prod deploy. It is unused by `sam local
      start-api` (which does not enforce API Gateway authorizers), so the local run
      needs no real value; the module edge verifies the bearer token itself regardless.
    Default: ""

  # --- Local-only injectables (empty in prod; supplied by --env-vars locally) ---
  # These are declared so `sam local start-api --env-vars` can OVERRIDE them
  # (SAM cannot inject undeclared vars). Empty defaults keep prod fail-fast: the
  # verified-auth edge raises PoolRegistryError on a blank COGNITO_POOL_KEYS, and
  # the DynamoDB client only overrides its endpoint when AWS_ENDPOINT_URL_DYNAMODB
  # is non-empty (unset -> real AWS).
  DynamoDbEndpointUrl:
    Type: String
    Description: LOCAL-ONLY DynamoDB endpoint (e.g. http://dynamodb-local:8000). Empty in prod.
    Default: ""

  CognitoPoolKeys:
    Type: String
    Description: Comma-separated Cognito pool keys for the verified-auth edge (e.g. "MYADMIN").
    Default: ""

  # NOTE (A.6): these carry the **myAdmin** pool's config (pool `eu-west-1_Hdp40eWmu`, PERSONAL
  # account) — NOT the h-dcn pool. The pool-registry KEY is `MYADMIN` (see COGNITO_POOL_KEYS);
  # the toolkit (`sam/shared/auth_utils.py`) is generic and reads `<KEY>_COGNITO_*`.
  MyAdminCognitoIssuer:
    Type: String
    Description: Issuer (iss) for the myAdmin pool (https://cognito-idp.<region>.amazonaws.com/<poolId>).
    Default: ""

  MyAdminCognitoJwksUri:
    Type: String
    Description: JWKS URI for the myAdmin pool.
    Default: ""

  MyAdminCognitoClientId:
    Type: String
    Description: App-client id (audience) for the myAdmin pool.
    Default: ""

  MyAdminCognitoPoolLabel:
    Type: String
    Description: Human-readable label for the myAdmin pool (diagnostics).
    Default: ""

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 256
    Timeout: 30
    Architectures:
      - x86_64

Resources:
  # --- The vendored layer: sam/shared + sam/members + shared dynamodb_client ---
  MembersLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: makefile
    Properties:
      LayerName: !Sub "members-layer-${Stage}"
      Description: >-
        Members runtime layer: vendors sam/shared (module-plane auth toolkit),
        sam/members (handler edge + domain + repository + tenants), and the shared
        services.dynamodb_client, plus the shared auth runtime deps.
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Retain

  # --- The one Members Lambda: the verified-auth edge ------------------------
  MembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "members-${Stage}"
      # The whole module ships in the layer; the function package itself is empty
      # (CodeUri points at an empty dir) so the handler resolves from the layer's
      # `python/sam/members/handler/app.py`.
      CodeUri: function/
      Handler: sam.members.handler.app.handler
      Layers:
        - !Ref MembersLayer
      # --- IAM: least-privilege DynamoDB access to the TWO tables the edge uses ---
      # The function had NO data-access policy (only the SAM-default basic-execution
      # role: CloudWatch Logs), so every DynamoDB call was AccessDenied -> the handler
      # raised -> API GW returned 502. It touches exactly two same-account tables:
      #   * governance_projection — READ-ONLY: the verified-auth edge Queries the
      #     tenant partition for scope CONFIG (config#*) + per-user scope GRANTS
      #     (scopegrant#*). Grant Query + GetItem only (no writes — MySQL is the
      #     system of record; this table is a one-directional projection, ADR 0005).
      #   * sam-members — READ/WRITE: the module's own member records + membership-type
      #     catalog (member CRUD, lifecycle, catalog). Grant the item + query + batch
      #     actions the repository uses.
      # Both are scoped to the exact table ARN (+ any index ARN) in THIS account/region;
      # no wildcard table, no cross-account. The tables are managed outside this stack
      # (Retain) — this only grants ACCESS to them, it does not create them.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: MembersReadGovernanceProjection
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${GovernanceProjectionTableName}"
            - Sid: MembersCrudMembersTable
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource:
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}"
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}/index/*"
      Environment:
        Variables:
          # Fail-fast table/region config (no dangerous defaults) — resolved from
          # the stack parameters, which themselves have no defaults.
          MEMBERS_TABLE: !Ref MembersTableName
          GOVERNANCE_PROJECTION_TABLE: !Ref GovernanceProjectionTableName
          # NOTE ON `--env-vars` (local): `sam local start-api --env-vars` can only
          #   OVERRIDE variables that are DECLARED here — it cannot ADD undeclared
          #   ones. So every var the local env-vars JSON supplies (the DynamoDB-Local
          #   endpoint + the Cognito pool registry the verified-auth edge needs) MUST
          #   be declared here, with an empty default so prod stays fail-fast (an
          #   unset/blank pool registry raises PoolRegistryError rather than trusting
          #   anything). Local values live in sam/members/env-vars.local.json.
          AWS_ENDPOINT_URL_DYNAMODB: !Ref DynamoDbEndpointUrl
          COGNITO_POOL_KEYS: !Ref CognitoPoolKeys
          MYADMIN_COGNITO_ISSUER: !Ref MyAdminCognitoIssuer
          MYADMIN_COGNITO_JWKS_URI: !Ref MyAdminCognitoJwksUri
          MYADMIN_COGNITO_CLIENT_ID: !Ref MyAdminCognitoClientId
          MYADMIN_COGNITO_POOL_LABEL: !Ref MyAdminCognitoPoolLabel
          # NOTE: NO MEMBERS_LOCAL_TENANT_ID — the local-dev tenant fallback was removed in
          #       s5c (R6.2, C-UNWIND). Tenant context resolves SOLELY from the verified
          #       entitlement (custom:entitlements); a token with no usable tenant denies
          #       honestly (403). No hardcoded/default tenant anywhere.
          # NOTE: AWS_REGION is NOT set here — it is a Lambda-RESERVED env var the
          #       runtime auto-populates from the deploy region (eu-west-1), so the
          #       fail-fast `require_env("AWS_REGION")` in services/dynamodb_client.py
          #       is satisfied without (and cannot be) an explicit declaration.
          #       Locally, `sam local` injects it via the env-vars JSON (task 1.3).
          # NOTE: NO MEMBERS_PILOT_ROUTING (pilot-routing gate dropped in S5b).
          # NOTE: AWS_ENDPOINT_URL_DYNAMODB is local-only; injected by `sam local`
          #       via its env-vars JSON (task 1.3), never defaulted here.
      Events:
        # ANY /{proxy+} — the single catch-all route; the module's internal router
        # (`sam/members/handler/router.py`) dispatches every path/method.
        AnyProxy:
          Type: Api
          Properties:
            RestApiId: !Ref MembersApi
            Path: /{proxy+}
            Method: ANY
        # Root path (`/`) so a bare request also reaches the edge.
        AnyRoot:
          Type: Api
          Properties:
            RestApiId: !Ref MembersApi
            Path: /
            Method: ANY

  # --- The API Gateway --------------------------------------------------------
  # ANY /{proxy+} + ANY /. The API declares a Cognito authorizer as its
  # `DefaultAuthorizer`, which is the prod gate (R6.1 — Cognito authorizer in prod;
  # supply the real pool ARN via `CognitoUserPoolArn` at prod deploy). Locally,
  # `sam local start-api` does NOT enforce API Gateway authorizers — it invokes the
  # function directly — so the local run is unaffected. Either way the module edge
  # additionally + authoritatively verifies the bearer token itself
  # (`get_verified_claims`, ADR 0004 — there is no unverified path).
  MembersApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        # CORS preflight fix: the CORS OPTIONS method that SAM auto-generates must NOT
        # be gated by the Cognito authorizer. Browsers send preflight OPTIONS with NO
        # Authorization header (per the Fetch/CORS spec), so if the DefaultAuthorizer
        # applies to it the preflight returns 401 with no CORS headers, and the browser
        # blocks EVERY real request (surfaced as "no members shown", all Members API
        # calls failing at preflight — verified live: OPTIONS /prod/members -> 401
        # UnauthorizedException, no Access-Control-* headers). Setting this to false lets
        # the preflight return the CORS headers below UNauthenticated, while every REAL
        # method (GET/POST/PUT/PATCH/DELETE) STILL requires a valid Cognito token. This
        # is the AWS-recommended setting for an authorized API with browser clients — it
        # does NOT weaken auth (real calls still gated) and does NOT weaken CORS (the
        # AllowOrigin/Methods/Headers rules below still apply).
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Tenant,X-Language'"
        AllowOrigin: "'*'"

Outputs:
  MembersFunctionArn:
    Description: ARN of the Members Lambda.
    Value: !GetAtt MembersFunction.Arn

  MembersLayerArn:
    Description: ARN of the Members runtime layer.
    Value: !Ref MembersLayer

  MembersApiBaseUrl:
    Description: >-
      Base URL of the Members API (feeds the SPA's MEMBERS_API_BASE_URL). Locally
      `sam local start-api` serves on http://127.0.0.1:3000 regardless of this output.
    Value: !Sub "https://${MembersApi}.execute-api.${Region}.amazonaws.com/${Stage}"

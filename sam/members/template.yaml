AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

# =============================================================================
# Members SAM app — one Lambda, one layer (S5b C11, task 1.1)
# =============================================================================
# The consolidated one-Lambda Members module (the S5 verified-auth edge
# `sam/members/handler/app.py`) as a SAM app that BUILDS (`sam build`) and RUNS
# (`sam local start-api`). It mirrors the S-plane Lambda-layer pattern
# (`35-sam-module-architecture-sam.md`) but with exactly ONE Lambda.
#
# Discipline (per requirements R6 + steering 23-aws-accounts.md):
#   * Every table/region env var is resolved FAIL-FAST — no dangerous defaults.
#     A missing value must break the deploy loudly, never silently point at the
#     wrong table or at production. So `MembersTableName` / `GovernanceProjectionTableName`
#     / `Region` are parameters WITHOUT defaults.
#   * The `sam-members` and `governance_projection` DynamoDB tables are NOT
#     resources in this template — they are managed-outside-CFN / retained
#     (23-aws-accounts.md). The template only REFERENCES their names via env vars.
#   * There is NO `MEMBERS_PILOT_ROUTING` env var. The pilot-routing gate is
#     dropped entirely (S5b): access is capability (token) + scope grant
#     (projection).
#   * `AWS_ENDPOINT_URL_DYNAMODB` is LOCAL-ONLY. It is not declared here (no
#     dangerous prod default); `sam local start-api` injects it via its env-vars
#     JSON file (task 1.3), and boto3 only overrides the endpoint when it is set
#     (`services/dynamodb_client.py`).
#
# -----------------------------------------------------------------------------
# BUILD (task 1.2, R6.3 — verified building the function + layer)
# -----------------------------------------------------------------------------
# Build both resources (MembersLayer + MembersFunction) from THIS directory:
#
#     cd sam/members && sam build
#
# `sam build` stages the layer under `sam/members/.aws-sam/build/MembersLayer/`
# (a DESCENDANT of `sam/members`), so the layer Makefile vendors `sam/shared` +
# `sam/members` with `rsync -a --exclude '.aws-sam' --exclude '__pycache__'
# --exclude 'tests'` (NOT `cp -r`) to skip the build tree and avoid the
# `cp: cannot copy a directory into itself` error. The source tree is only read,
# never mutated. Requires `sam`, `rsync`, and `python` (with pip) on PATH; the
# layer build pip-installs the shared auth deps (PyJWT / cryptography / requests)
# from `sam/shared/requirements.txt`. On success `sam build` prints
# `Build Succeeded` and both `MembersLayer/` and `MembersFunction/` appear under
# `.aws-sam/build/`. Next: `sam local start-api` (task 1.3).
# =============================================================================

Description: >-
  Members module (S5b): one Lambda (verified-auth edge) + one layer vendoring
  sam/shared + sam/members + the shared dynamodb_client, behind an ANY /{proxy+}
  API. Tables are managed outside this template (retain).

Parameters:
  MembersTableName:
    Type: String
    Description: >-
      Name of the module-plane Members DynamoDB table. Per environment:
        * prod  — `sam-members` (unprefixed)
        * test  — `test_sam-members` (the `test_` environment boundary)
        * local — `sam-members-local`
      Managed outside this template. No default — fail-fast (23-aws-accounts.md).
    AllowedPattern: "^(test_)?sam-members.*$"
    ConstraintDescription: >-
      Must be `sam-members*` (prod/local) or `test_sam-members*` (TEST) — the SAM-plane
      `sam-members` core, optionally under the `test_` environment prefix.

  GovernanceProjectionTableName:
    Type: String
    Description: >-
      Name of the governance projection DynamoDB table the module READS config /
      scope grants from (carries its own env prefix, e.g. `governance_projection`
      or `local_governance_projection`). Managed outside this template. No default —
      fail-fast.

  Region:
    Type: String
    Description: >-
      AWS region for the module (eu-west-1). Surfaced as the `AWS_REGION` runtime
      env var the fail-fast dynamodb_client requires. No default — fail-fast.
    AllowedValues:
      - eu-west-1

  Stage:
    Type: String
    Description: >-
      Deployment stage — names the API stage + resources (`members-<stage>`) and the
      output URL, AND carries the environment selector APP_ENV into the Lambda (see
      the StageToAppEnv mapping). Values:
        * `local` — `sam local start-api` (dev loop); APP_ENV=test.
        * `test`  — the TEST stack (`test_sam-members`), test Cognito pool,
                    `test_`-prefixed tables; APP_ENV=test.
        * `prod`  — the PRODUCTION stack (`sam-members`), prod pool, unprefixed
                    tables; APP_ENV=production.
      This is the single environment knob (reused rather than a parallel param) so
      the stage, pool, tables, and APP_ENV cannot disagree.
    Default: local
    AllowedValues:
      - local
      - test
      - prod

  CognitoUserPoolArn:
    Type: String
    Description: >-
      ARN of the Cognito user pool that fronts the API (R6.1 — Cognito authorizer in
      prod). Supply the real pool ARN at prod deploy. It is unused by `sam local
      start-api` (which does not enforce API Gateway authorizers), so the local run
      needs no real value; the module edge verifies the bearer token itself regardless.
    Default: ""

  # --- Local-only injectables (empty in prod; supplied by --env-vars locally) ---
  # These are declared so `sam local start-api --env-vars` can OVERRIDE them
  # (SAM cannot inject undeclared vars). Empty defaults keep prod fail-fast: the
  # verified-auth edge raises PoolRegistryError on a blank COGNITO_POOL_KEYS, and
  # the DynamoDB client only overrides its endpoint when AWS_ENDPOINT_URL_DYNAMODB
  # is non-empty (unset -> real AWS).
  DynamoDbEndpointUrl:
    Type: String
    Description: LOCAL-ONLY DynamoDB endpoint (e.g. http://dynamodb-local:8000). Empty in prod.
    Default: ""

  CognitoPoolKeys:
    Type: String
    Description: Comma-separated Cognito pool keys for the verified-auth edge (e.g. "MYADMIN").
    Default: ""

  # NOTE (A.6): these carry the **myAdmin** pool's config (pool `eu-west-1_Hdp40eWmu`, PERSONAL
  # account) — NOT the h-dcn pool. The pool-registry KEY is `MYADMIN` (see COGNITO_POOL_KEYS);
  # the toolkit (`sam/shared/auth_utils.py`) is generic and reads `<KEY>_COGNITO_*`.
  MyAdminCognitoIssuer:
    Type: String
    Description: Issuer (iss) for the myAdmin pool (https://cognito-idp.<region>.amazonaws.com/<poolId>).
    Default: ""

  MyAdminCognitoJwksUri:
    Type: String
    Description: JWKS URI for the myAdmin pool.
    Default: ""

  MyAdminCognitoClientId:
    Type: String
    Description: App-client id (audience) for the myAdmin pool.
    Default: ""

  MyAdminCognitoPoolLabel:
    Type: String
    Description: Human-readable label for the myAdmin pool (diagnostics).
    Default: ""

  # --- Secret: the OpenRouter API key for the Members AI-improve adapter (R2, task 2.4) ---
  # Supplied PER ENVIRONMENT at deploy time (NOT stored in this template, NOT in CI
  # config — OIDC-only deploys, steering 43 "no secrets in CI"). `NoEcho` keeps it out
  # of CloudFormation console/CLI output. NO default and `AllowedPattern` forces a real
  # `sk-or-v1-...` key, so a deploy that forgets the key fails LOUDLY rather than wiring
  # a blank secret (steering 23 no-dangerous-fallback); the adapter itself also reads it
  # fail-fast at runtime (`domain/ai_improve.require_env`).
  OpenRouterApiKey:
    Type: String
    NoEcho: true
    Description: >-
      OpenRouter API key for the Members AI-improve adapter (R2). Secret — supply per
      environment at deploy time; never commit it or place it in CI config (steering
      43). Empty default: when unset, AI-improve is unavailable (adapter fail-closed), the rest of the module deploys and runs normally.
    Default: ""
    AllowedPattern: "^(sk-or-v1-.+)?$"
    ConstraintDescription: >-
      Either empty (AI-improve unavailable) or a real OpenRouter key beginning `sk-or-v1-`,
      supplied per-env at deploy time (never committed / never in CI).

  # The configured AI model (config-selects-strategy, steering 36). Defaults to the
  # free router; the adapter REFUSES any value outside its free-model allow-list
  # (fail-closed cost guard, R2) — so this can never select a costly model.
  MembersAiModel:
    Type: String
    Description: >-
      The OpenRouter model id the AI-improve adapter uses (R2). Config, not hardcoded
      (steering 36). Must be a free-tier id on the adapter's allow-list; a disallowed
      value is REFUSED fail-closed at runtime (cost guard).
    Default: "openrouter/free"

  # --- SES config: the verified sender + the configuration set (R0, task 0.5) ---
  # SES is a nonprofit-deploy service (`506221081911`/`eu-west-1`, steering 23). These
  # supply the Members send-path with WHICH tenant mail DOMAIN it may send `From` and WHICH
  # SES configuration set publishes bounce/complaint events (see the spec's myNotes.md: today
  # `SES_CONFIGURATION_SET` is only a loose env var on the Flask side — this makes the per-env
  # wiring explicit IaC).
  #
  # SENDER MODEL (mail-spec R4.1/R4.2, task 4.2) — PER-TENANT, no `jabaki.nl` substitute:
  #   The envelope From is resolved AT SEND TIME, per tenant, as `noreply@<tenant-domain>` by
  #   the pre-send resolver (`domain/mail_sender_resolver.py`) from the projected `config#mail`
  #   row — it is NOT a single static address, and there is NO foreign/substitute-sender
  #   fallback (the old `support@jabaki.nl` global sender is GONE from the code path, task 1.2).
  #   The IAM send grant below must therefore authorize sending AS `noreply@<tenant-domain>`,
  #   NOT as a single hardcoded address. SES authorizes a send against the IDENTITY resource,
  #   and a verified DOMAIN identity (`identity/<domain>`) covers every `*@<domain>` address, so
  #   the grant is scoped to the verified tenant DOMAIN identity + a `ses:FromAddress` Condition
  #   that pins the local-part to `noreply@<domain>` (belt-and-suspenders — no arbitrary
  #   address under the domain, and never a foreign domain).
  #
  # OPERATOR / MULTI-TENANT NOTE (deferred — see task 4.2 report + Phase 7): `MailSenderDomain`
  #   names the ONE verified tenant mail domain this stack env is scoped to today (h-dcn.nl is
  #   the first/only certified tenant). The grant is deliberately scoped to that single verified
  #   domain identity rather than a broad `identity/*` wildcard (least privilege — a wildcard
  #   would let the role send as ANY identity in the account, re-opening the foreign-sender
  #   risk R4.2 guards against). When ADDITIONAL tenants are certified, broadening this grant to
  #   their domain identities is an OPERATOR decision (which domains are actually SES-verified in
  #   nonprofit-deploy is operational truth, not template-time truth) — handled by widening this
  #   parameter to the additional verified domain(s), NOT by a wildcard. Do NOT silently widen.
  MailSenderDomain:
    Type: String
    Description: >-
      The VERIFIED tenant mail DOMAIN the Members send-path is authorized to send `From` as
      `noreply@<domain>` (mail-spec R4.1/R4.2, task 4.2). Must be a VERIFIED SES domain identity
      in nonprofit-deploy (`506221081911`/`eu-west-1`) — the tenant's own domain (e.g. `h-dcn.nl`),
      NEVER `jabaki.nl`. Supplied per env via samconfig.toml; the SES send IAM statement is scoped
      to this domain's `identity/<domain>` ARN and Condition-scoped to `ses:FromAddress =
      noreply@<domain>`. No default — fail-fast (23-aws-accounts.md): a blank domain must break the
      deploy, never send from an unintended/foreign domain.
    AllowedPattern: "^[^@\\s.]+\\.[^@\\s]+$"
    ConstraintDescription: >-
      Must be a bare domain name (e.g. h-dcn.nl) that is a VERIFIED SES DOMAIN identity in the
      nonprofit-deploy account / eu-west-1 — the tenant's own domain, never a single address and
      never jabaki.nl.

  # SesConfigurationSet — the SES configuration set the send-path attaches on EVERY send
  # (R0 task 0.5), AND, as of mail-spec task 5.1 (R8.4/R9.5), the NAME of the config-set
  # RESOURCE this stack now OWNS (the `MembersSesConfigurationSet` resource below) whose SNS
  # event destination publishes bounce/complaint/delivery events for the task-5.2 ingestion
  # handler. Historically this only MIRRORED the Flask-side `myadmin-emails` set declared in
  # `infrastructure/ses.tf` — but that Terraform set lives in the PERSONAL account
  # (344561557829), whereas the Members plane sends from nonprofit-deploy (506221081911). A
  # config set is account+region scoped, so the Members plane needs its OWN set in
  # nonprofit-deploy: this stack now creates it (per env) and the send-path attaches it by name.
  #
  # PER-ENV + fail-fast (steering 23/43): the name is `members-emails` (prod) /
  # `members-emails-test` (test), supplied via samconfig.toml. NO default — a blank config-set
  # name must break the deploy loudly, never create an unnamed/colliding set or silently stop
  # publishing feedback. The resource's `Name` and this env var are BOTH `!Ref SesConfigurationSet`,
  # so what the sender attaches and what owns the SNS event destination cannot disagree.
  SesConfigurationSet:
    Type: String
    Description: >-
      Name of the SES configuration set applied on every send AND owned by this stack (mail-spec
      task 5.1, R8.4/R9.5). Its SNS event destination (the `MembersSesEventDestination` resource)
      publishes bounce/complaint/delivery events to the Members feedback SNS topic the task-5.2
      ingestion handler consumes. Per environment: `members-emails` (prod) / `members-emails-test`
      (test). No default — fail-fast (steering 23): a blank name must break the deploy, never a
      silent/unnamed set. Config, not hardcoded (steering 36); supplied per env via samconfig.toml.
      The send-path (`resolve_ses_configuration_set`) attaches it per send; the sender attaches the
      SAME name the resource is created with (both `!Ref SesConfigurationSet`).
    AllowedPattern: "^members-emails(-test)?$"
    ConstraintDescription: >-
      Must be `members-emails` (prod) or `members-emails-test` (TEST) — the per-env Members SES
      configuration-set name this stack owns (mail task 5.1). NOT the Flask-side `myadmin-emails`
      (that set lives in the PERSONAL account; the Members plane owns its own in nonprofit-deploy).

  # --- SES feedback SNS topic name (R8.4/R9.5, mail task 5.1) ----------------
  # Names the ONE account-level SNS sink the Members SES configuration set publishes
  # bounce/complaint/delivery events to (the `MembersMailFeedbackTopic` resource below). SES
  # has no module concept, so it publishes to ONE topic per config set; the task-5.2 ingestion
  # handler subscribes to it and routes each event to the Members store by `run_id`/tag (R9.5).
  # Per environment following the existing naming discipline (same `-test` shape as the send
  # queue): `members-mail-feedback` (prod) / `members-mail-feedback-test` (test). NO default —
  # fail-fast (steering 23): a blank topic name must break the deploy, never create an
  # unnamed/colliding topic or silently drop feedback. SNS is a nonprofit-deploy service
  # (506221081911 / eu-west-1, steering 23), same account as the rest of this stack. TEST and
  # PROD are distinct stacks, so each owns its OWN topic (no cross-env sharing).
  MailFeedbackTopicName:
    Type: String
    Description: >-
      Name of the SNS topic the Members SES configuration set publishes bounce/complaint/delivery
      events to (mail task 5.1, R8.4/R9.5). Per environment: `members-mail-feedback` (prod) /
      `members-mail-feedback-test` (test). No default — fail-fast (steering 23). The task-5.2
      ingestion handler subscribes to this topic's ARN (exposed as the `MailFeedbackTopicArn`
      output) and routes each event to the Members store by run_id/message tag.
    AllowedPattern: "^members-mail-feedback(-test)?$"
    ConstraintDescription: >-
      Must be `members-mail-feedback` (prod) or `members-mail-feedback-test` (TEST) — the per-env
      Members SES-feedback SNS topic name following the existing naming discipline.

  # --- SQS mail-send queue name (R4, pivot-output-actions task 4.2) ---
  # The queued send path (R4, design §4.2): the `deliver` route (and the R5 scheduler) ENQUEUE
  # send jobs here; a worker Lambda (task 4.4 — the CONSUMER side, declared on top of this by
  # 4.4, not here) drains the queue at the SES rate so the request never blocks on the send.
  # Per-env name following the existing naming discipline (same shape as the `test_` table
  # prefix): `members-mail-send` (prod) / `members-mail-send-test` (test). NO default —
  # fail-fast (23-aws-accounts.md): a blank queue name must break the deploy, never create an
  # unnamed/wrong queue. Supplied per env via samconfig.toml (prod/test). The queue + its DLQ
  # are NEW infra owned by this spec (R0: infra is in scope); SQS is a nonprofit-deploy service
  # (506221081911 / eu-west-1, steering 23), same account as the rest of this stack.
  MailSendQueueName:
    Type: String
    Description: >-
      Name of the SQS mail-send queue (R4). Per environment: `members-mail-send` (prod),
      `members-mail-send-test` (test). No default — fail-fast (23-aws-accounts.md). The DLQ is
      derived as `<MailSendQueueName>-dlq`. The Members function env var `MAIL_SEND_QUEUE_URL`
      + the `sqs:SendMessage` IAM grant are scoped to exactly THIS queue (no wildcard).
    AllowedPattern: "^members-mail-send(-test)?$"
    ConstraintDescription: >-
      Must be `members-mail-send` (prod) or `members-mail-send-test` (TEST) — the per-env
      send-queue name following the existing naming discipline.

  # --- Worker drain concurrency knob (R4, task 4.4 — the CONSUMER side) -------
  # The worker Lambda drains `members-mail-send` → SES. SES is rate-limited (the granted
  # send rate is 14 msg/s today, design §6.4), so the worker's concurrency is BOUNDED — if
  # it scaled freely, N per-recipient jobs would fan out past the SES rate and trip the
  # throttle (distinct 429) → needless retries/DLQ. This is the SQS event-source
  # `ScalingConfig.MaximumConcurrency`: the max number of concurrent worker invocations SQS
  # will drive. Default 10 (comfortably UNDER the 14/s grant assuming ~1 send ≈ 1s per
  # invocation at BatchSize 1 — leaves headroom for the SES burst allowance and for the
  # Flask-plane prod SES that shares the account). It is a per-env knob (config, steering 36
  # / 43) so TEST can drain slower and the value can be re-tuned once production SES access
  # lands without a code change (design §12 open item). Min 2 is the SQS floor for
  # MaximumConcurrency.
  MailWorkerMaxConcurrency:
    Type: Number
    Description: >-
      Max concurrent mail-worker invocations SQS drives (R4). BOUNDED so the drain rate
      stays under the granted SES send rate (14/s, design §6.4) — otherwise per-recipient
      fan-out would trip the SES throttle. Per-env knob (samconfig.toml); default 10.
    Default: 10
    MinValue: 2
    MaxValue: 100

  # --- EventBridge Scheduler schedule-group name (R5, pivot-output-actions task 5.3) ---
  # The scheduled send path (R5, design §4.3/§5): schedules are DYNAMIC — one EventBridge
  # Scheduler SCHEDULE per stored `schedule#<id>` record, created at RUNTIME by the schedule
  # CRUD path (task 5.2) via the Scheduler API, NOT declared statically (they are tenant/user
  # data, an unknown growing set). This parameter names the per-env schedule GROUP those
  # runtime schedules live in, so (a) a tenant's schedules are bucketed in one named group and
  # (b) the Members function's `scheduler:*` IAM grant can be scoped to exactly this group's
  # ARN pattern (no account-wide `scheduler:*`). Per environment following the existing naming
  # discipline: `members-schedules` (prod) / `members-schedules-test` (test). No default —
  # fail-fast (23-aws-accounts.md): a blank group name must break the deploy, never create
  # runtime schedules in the account `default` group by accident. EventBridge Scheduler is a
  # nonprofit-deploy service (506221081911 / eu-west-1, steering 23), same account as the stack.
  SchedulerGroupName:
    Type: String
    Description: >-
      Name of the EventBridge Scheduler schedule-group the runtime per-schedule schedules live
      in (R5). Per environment: `members-schedules` (prod), `members-schedules-test` (test). No
      default — fail-fast. The Members function's `scheduler:*` grant is scoped to this group's
      ARN pattern; the schedules themselves are created at runtime by the task-5.2 CRUD path.
    AllowedPattern: "^members-schedules(-test)?$"
    ConstraintDescription: >-
      Must be `members-schedules` (prod) or `members-schedules-test` (TEST) — the per-env
      scheduler schedule-group name following the existing naming discipline.

# Stage -> APP_ENV: the deploy stage is the single environment knob; APP_ENV is
# DERIVED from it so the two cannot drift. `local` and `test` both resolve to the
# TEST environment (APP_ENV=test); only `prod` is production. This mirrors the
# backend/frontend Environment_Resolver contract (APP_ENV in {test, production}).
Mappings:
  StageToAppEnv:
    local:
      AppEnv: test
    test:
      AppEnv: test
    prod:
      AppEnv: production

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 256
    Timeout: 30
    Architectures:
      - x86_64

Resources:
  # --- The vendored layer: sam/shared + sam/members + shared dynamodb_client ---
  MembersLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: makefile
    Properties:
      LayerName: !Sub "members-layer-${Stage}"
      Description: >-
        Members runtime layer: vendors sam/shared (module-plane auth toolkit),
        sam/members (handler edge + domain + repository + tenants), and the shared
        services.dynamodb_client, plus the shared auth runtime deps.
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Retain

  # --- SQS mail-send DLQ (R4, task 4.2) --------------------------------------
  # The dead-letter queue the send queue redrives to after N failed receives. A message that
  # cannot be processed (e.g. a persistent SES failure the worker surfaces as retryable) is
  # retried via the main queue and, after `maxReceiveCount` receives, moved HERE so it is an
  # operational signal (an alarm target), NOT a silent drop (design §4.2/§9). Declared BEFORE
  # the main queue because the main queue's RedrivePolicy references its ARN. 14-day retention
  # (the SQS max) so a dead-lettered send is retained long enough to inspect/replay.
  MailSendDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${MailSendQueueName}-dlq"
      MessageRetentionPeriod: 1209600 # 14 days (SQS max) — keep dead-lettered sends to inspect

  # --- SQS mail-send queue (R4, task 4.2) ------------------------------------
  # The queued send path (R4, design §4.2): the `deliver` route + the R5 scheduler ENQUEUE send
  # jobs here; a worker Lambda (task 4.4 — the CONSUMER side + its event-source mapping are added
  # ON TOP of this by 4.4, NOT here) drains it at the SES rate. VisibilityTimeout 300s gives the
  # (future) worker ample time to render + send one job before the message becomes visible again
  # (it must be >= the worker's timeout; sized generously now, tuned with the worker in 4.4).
  # RedrivePolicy: after `maxReceiveCount` (5) failed receives a message is moved to the DLQ —
  # a sane default (design §4.2/§6: "dead-letter after N attempts"), enough retries to ride out a
  # transient SES throttle/outage without hammering a poison message forever. 14-day retention.
  MailSendQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref MailSendQueueName
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600 # 14 days (SQS max)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MailSendDeadLetterQueue.Arn
        maxReceiveCount: 5

  # --- The one Members Lambda: the verified-auth edge ------------------------
  MembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "members-${Stage}"
      # The whole module ships in the layer; the function package itself is empty
      # (CodeUri points at an empty dir) so the handler resolves from the layer's
      # `python/sam/members/handler/app.py`.
      CodeUri: function/
      Handler: sam.members.handler.app.handler
      Layers:
        - !Ref MembersLayer
      # --- IAM: least-privilege DynamoDB access to the TWO tables the edge uses ---
      # The function had NO data-access policy (only the SAM-default basic-execution
      # role: CloudWatch Logs), so every DynamoDB call was AccessDenied -> the handler
      # raised -> API GW returned 502. It touches exactly two same-account tables:
      #   * governance_projection — READ-ONLY: the verified-auth edge Queries the
      #     tenant partition for scope CONFIG (config#*) + per-user scope GRANTS
      #     (scopegrant#*). Grant Query + GetItem only (no writes — MySQL is the
      #     system of record; this table is a one-directional projection, ADR 0005).
      #   * sam-members — READ/WRITE: the module's own member records + membership-type
      #     catalog (member CRUD, lifecycle, catalog). Grant the item + query + batch
      #     actions the repository uses.
      # Both are scoped to the exact table ARN (+ any index ARN) in THIS account/region;
      # no wildcard table, no cross-account. The tables are managed outside this stack
      # (Retain) — this only grants ACCESS to them, it does not create them.
      #
      # TENANCY (risk S1 / security-assessment-2026-09-26 M2): there is intentionally NO
      # `dynamodb:LeadingKeys` condition and NO per-tenant `PrincipalTag` here. The function
      # runs as a SINGLE SHARED principal, so tenant isolation is STRUCTURAL-ONLY today — it
      # rests on the repository (`sam/members/repository/members_repository.py`, the sole
      # DynamoDB touch-point) always pinning the `tenant_id` partition key on every read/write
      # (no `.scan()` anywhere). The `LeadingKeys` credential-level backstop is a documented
      # PLAN only (`table_design.LEADING_KEYS_IAM_POLICY_PLAN`); deploying it would require
      # per-request session tagging (a live-IAM change), so this template deliberately does NOT
      # claim it. The compensating control is the repository-invariant test
      # (`sam/tests/test_members_repository_tenant_invariant.py`). Keep this template, that
      # test, and the `table_design.py` docs in agreement: structural isolation only, for now.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: MembersReadGovernanceProjection
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${GovernanceProjectionTableName}"
            - Sid: MembersCrudMembersTable
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource:
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}"
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}/index/*"
            # --- SES: send-only, scoped to the verified tenant DOMAIN identity (R4.1/R4.2, task 4.2) ---
            # The Members send-path (R1–R5, mail compose + the queued worker) needs the SES
            # send actions. `ses:SendEmail` covers the simple compose path; `ses:SendRawEmail`
            # covers MIME messages with attachments (CSV / PDF labels, section 4). We do NOT
            # grant `ses:SendBulkEmail` — the design fans per-recipient merge out into
            # individual queued sends (section 4.2), it does not use SES bulk templates, so
            # bulk-send stays out of the grant (least privilege).
            #
            # PER-TENANT SENDER (task 4.2 — the `jabaki.nl` substitute-sender fallback is GONE):
            #   The From is `noreply@<tenant-domain>` resolved per send (never a single static
            #   address, never a foreign/substitute sender — R4.2). SES authorizes a send against
            #   the IDENTITY resource, and a verified DOMAIN identity (`identity/<domain>`) covers
            #   every `*@<domain>` address, so the grant is scoped to the tenant's verified DOMAIN
            #   identity — this is what lets the role send AS `noreply@<domain>`. (The old grant
            #   scoped to `identity/support@jabaki.nl` + a `ses:FromAddress == support@jabaki.nl`
            #   Condition would DENY the per-tenant `noreply@<domain>` send — that single-address
            #   assumption is removed here.)
            #
            # SCOPING (steering 23 exact-scope, mirrors the DynamoDB statements above):
            #   * Resource is the exact verified tenant DOMAIN-identity ARN for this account/region
            #     — the `identity/<domain>` ARN (from `MailSenderDomain`), NOT a wildcard. SES
            #     authorizes a send against the identity resource, so this bars sending as any
            #     OTHER domain/identity (no foreign-sender leak, R4.2).
            #   * A `Condition` on `ses:FromAddress` pins the From local-part to EXACTLY
            #     `noreply@<domain>` — belt-and-suspenders over the domain-identity scope: the
            #     role can only send as the fixed-generic `noreply@` sender the resolver composes
            #     (R4.1), not as an arbitrary address under the domain.
            # SES is a nonprofit-deploy service (`506221081911`/`eu-west-1`, steering 23); the
            # domain identity is verified OPERATIONALLY per tenant at onboarding (mail-spec task
            # 6.1 runbook) — this only grants send ACCESS to it.
            - Sid: MembersSendViaSes
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub "arn:aws:ses:${Region}:${AWS::AccountId}:identity/${MailSenderDomain}"
                # A SendEmail/SendRawEmail call that names a ConfigurationSetName is authorized
                # against BOTH the identity AND the configuration-set resource — so the config
                # set this stack owns must be in the Resource list too, else SES returns
                # AccessDenied on `configuration-set/<name>` (mail-spec Phase 7 fix).
                - !Sub "arn:aws:ses:${Region}:${AWS::AccountId}:configuration-set/${SesConfigurationSet}"
              Condition:
                StringEquals:
                  "ses:FromAddress": !Sub "noreply@${MailSenderDomain}"
            # --- SQS: send-only, scoped to the exact mail-send queue ARN (R4, task 4.2) ---
            # The queued send path (R4, design §4.2): the Members function ENQUEUES send jobs to
            # the `members-mail-send[-test]` queue — the `deliver` route and the R5 scheduler
            # both go through it. The function is the PRODUCER only; it does NOT consume/delete
            # (that is the worker — task 4.4, which adds the consumer-side grant on top), so this
            # grant is `sqs:SendMessage` ONLY (least privilege — no Receive/Delete/GetQueueUrl).
            #
            # SCOPING (steering 23 exact-scope, mirrors the DynamoDB + SES statements above): the
            # Resource is the EXACT queue ARN (`!GetAtt MailSendQueue.Arn`) in this account/region
            # — NOT a wildcard, NOT the DLQ (the producer never writes to the DLQ; only the
            # redrive policy does). SQS is a nonprofit-deploy service (506221081911 / eu-west-1,
            # steering 23), same account as the rest of this stack.
            - Sid: MembersEnqueueMailSend
              Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !GetAtt MailSendQueue.Arn
            # --- EventBridge Scheduler: manage the runtime per-schedule schedules (R5, task 5.3) ---
            # The schedule CRUD path (task 5.2) runs IN this function and materializes/updates/
            # removes ONE EventBridge schedule per stored `schedule#<id>` record via the Scheduler
            # API (repository/scheduler_api). It therefore needs Create/Update/Delete/GetSchedule,
            # SCOPED (steering 23 exact-ARN, mirroring the DynamoDB/SES/SQS statements) to schedules
            # INSIDE this stack's own schedule-group ONLY — the Resource is the group's
            # `schedule/<group>/*` ARN pattern, NOT account-wide `scheduler:*`. GetSchedule is
            # included so an update/delete can read-before-write; ListSchedules is NOT granted
            # (the record store is DynamoDB, the system of record — EventBridge is its shadow).
            - Sid: MembersManageSchedules
              Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:UpdateSchedule
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${Region}:${AWS::AccountId}:schedule/${SchedulerGroupName}/*"
            # --- iam:PassRole: pass EXACTLY the scheduler-execution-role (R5, task 5.3) --------
            # Creating a schedule with a Lambda target requires passing the role EventBridge
            # Scheduler assumes to invoke it. `iam:PassRole` is a privilege-escalation-sensitive
            # action, so it is scoped to EXACTLY the one `MembersSchedulerExecutionRole` ARN (no
            # wildcard) AND conditioned to the `scheduler.amazonaws.com` service (the role can only
            # be passed TO EventBridge Scheduler, never anywhere else). This is the exact-ARN,
            # least-privilege discipline (steering 23): the task-5.2 CRUD path can pass this one
            # role to this one service, nothing more.
            - Sid: MembersPassSchedulerExecutionRole
              Effect: Allow
              Action:
                - iam:PassRole
              Resource:
                - !GetAtt MembersSchedulerExecutionRole.Arn
              Condition:
                StringEquals:
                  "iam:PassedToService": scheduler.amazonaws.com
      Environment:
        Variables:
          # APP_ENV — the environment selector, DERIVED from the Stage parameter via
          # the StageToAppEnv mapping (local/test -> test, prod -> production). The
          # Lambda therefore carries the SAME authoritative selector as the Flask
          # backend/frontend, and it is impossible for the stage, pool, tables, and
          # APP_ENV to disagree within a single deployed stack.
          APP_ENV: !FindInMap [StageToAppEnv, !Ref Stage, AppEnv]
          # Fail-fast table/region config (no dangerous defaults) — resolved from
          # the stack parameters, which themselves have no defaults.
          MEMBERS_TABLE: !Ref MembersTableName
          GOVERNANCE_PROJECTION_TABLE: !Ref GovernanceProjectionTableName
          # NOTE ON `--env-vars` (local): `sam local start-api --env-vars` can only
          #   OVERRIDE variables that are DECLARED here — it cannot ADD undeclared
          #   ones. So every var the local env-vars JSON supplies (the DynamoDB-Local
          #   endpoint + the Cognito pool registry the verified-auth edge needs) MUST
          #   be declared here, with an empty default so prod stays fail-fast (an
          #   unset/blank pool registry raises PoolRegistryError rather than trusting
          #   anything). Local values live in sam/members/env-vars.local.json.
          AWS_ENDPOINT_URL_DYNAMODB: !Ref DynamoDbEndpointUrl
          COGNITO_POOL_KEYS: !Ref CognitoPoolKeys
          MYADMIN_COGNITO_ISSUER: !Ref MyAdminCognitoIssuer
          MYADMIN_COGNITO_JWKS_URI: !Ref MyAdminCognitoJwksUri
          MYADMIN_COGNITO_CLIENT_ID: !Ref MyAdminCognitoClientId
          MYADMIN_COGNITO_POOL_LABEL: !Ref MyAdminCognitoPoolLabel
          # --- AI-improve adapter (R2, task 2.4) ---
          # OPENROUTER_API_KEY: the secret, wired PER ENV from the NoEcho parameter
          #   (never committed, never in CI — steering 43). The adapter reads it
          #   fail-fast (`domain/ai_improve.require_env`); a blank value is impossible
          #   because the parameter has no default + an `sk-or-v1-` AllowedPattern.
          # MEMBERS_AI_MODEL: the configured model (steering 36). The adapter enforces
          #   its free-model allow-list fail-closed, so this cannot select a costly model.
          OPENROUTER_API_KEY: !Ref OpenRouterApiKey
          MEMBERS_AI_MODEL: !Ref MembersAiModel
          # --- SES send config (R4, task 4.2) ---
          # NOTE: there is NO `SES_SENDER_EMAIL` env var any more (mail-spec task 1.2/4.2). The
          #   From is `noreply@<tenant-domain>` resolved PER SEND by the pre-send resolver from
          #   the projected `config#mail` row — the single global sender env var (and the
          #   `jabaki.nl` substitute it carried) is GONE from the code path, so injecting it here
          #   would be a dead/misleading var. WHO the role may send AS is enforced by the IAM
          #   `MembersSendViaSes` grant above (scoped to the verified tenant DOMAIN identity +
          #   `ses:FromAddress = noreply@<domain>`), not by an env var.
          # SES_CONFIGURATION_SET: the ONLY SES env the adapter still reads
          #   (`resolve_ses_configuration_set`) — the config set that publishes bounce/complaint
          #   events; attached per send only when non-blank. Mirrors the Flask
          #   `ses_email_service.py` contract.
          SES_CONFIGURATION_SET: !Ref SesConfigurationSet
          # --- SQS mail-send queue (R4, task 4.2) ---
          # MAIL_SEND_QUEUE_URL: the REAL queue URL the enqueue port
          #   (`repository/mail_send_queue.SqsMailSendQueue`) sends to; resolved fail-fast at
          #   runtime (`resolve_mail_send_queue_url` → require_env), so a blank value is impossible
          #   (the queue is a stack resource, its URL is always available). The IAM
          #   `MembersEnqueueMailSend` grant above is scoped to this same queue's ARN, so the env
          #   var and the grant cannot disagree. The worker/consumer side (task 4.4) is NOT wired
          #   here — only the producer env var + grant.
          MAIL_SEND_QUEUE_URL: !Ref MailSendQueue
          # --- EventBridge Scheduler wiring for the task-5.2 CRUD path (R5, task 5.3) ---
          # The schedule CRUD path (task 5.2 — runs in THIS function) materializes one
          # EventBridge schedule per `schedule#<id>` record via the Scheduler API
          # (repository/scheduler_api). It resolves three pieces of wiring fail-fast from the env:
          #   SCHEDULER_TARGET_FUNCTION_ARN — the ARN each schedule invokes: the dedicated
          #     trigger function (NOT this HTTP function). `!GetAtt ...TriggerFunction.Arn`.
          #   SCHEDULER_EXECUTION_ROLE_ARN — the role EventBridge Scheduler assumes to invoke the
          #     trigger; the `iam:PassRole` grant above is scoped to EXACTLY this ARN, so env +
          #     grant cannot disagree.
          #   SCHEDULER_GROUP_NAME — the schedule-group the runtime schedules are created in; the
          #     `scheduler:*` grant above is scoped to this group's ARN pattern.
          SCHEDULER_TARGET_FUNCTION_ARN: !GetAtt MembersSchedulerTriggerFunction.Arn
          SCHEDULER_EXECUTION_ROLE_ARN: !GetAtt MembersSchedulerExecutionRole.Arn
          SCHEDULER_GROUP_NAME: !Ref SchedulerGroupName
          # NOTE: NO MEMBERS_LOCAL_TENANT_ID — the local-dev tenant fallback was removed in
          #       s5c (R6.2, C-UNWIND). Tenant context resolves SOLELY from the verified
          #       entitlement (custom:entitlements); a token with no usable tenant denies
          #       honestly (403). No hardcoded/default tenant anywhere.
          # NOTE: AWS_REGION is NOT set here — it is a Lambda-RESERVED env var the
          #       runtime auto-populates from the deploy region (eu-west-1), so the
          #       fail-fast `require_env("AWS_REGION")` in services/dynamodb_client.py
          #       is satisfied without (and cannot be) an explicit declaration.
          #       Locally, `sam local` injects it via the env-vars JSON (task 1.3).
          # NOTE: NO MEMBERS_PILOT_ROUTING (pilot-routing gate dropped in S5b).
          # NOTE: AWS_ENDPOINT_URL_DYNAMODB is local-only; injected by `sam local`
          #       via its env-vars JSON (task 1.3), never defaulted here.
      Events:
        # ANY /{proxy+} — the single catch-all route; the module's internal router
        # (`sam/members/handler/router.py`) dispatches every path/method.
        AnyProxy:
          Type: Api
          Properties:
            RestApiId: !Ref MembersApi
            Path: /{proxy+}
            Method: ANY
        # Root path (`/`) so a bare request also reaches the edge.
        AnyRoot:
          Type: Api
          Properties:
            RestApiId: !Ref MembersApi
            Path: /
            Method: ANY

  # --- The mail-send worker Lambda: the queue CONSUMER (R4, task 4.4) --------
  # The CONSUMER side of the R4 queued send path (design §4.2/§4.3). The `deliver` route +
  # the R5 scheduler are the PRODUCER (they enqueue to MailSendQueue via MembersFunction's
  # `sqs:SendMessage` grant); THIS function drains the queue and does the actual SES send so
  # the request never blocks on it:
  #   render (mail-merge per recipient / attach for to_fixed) → SES send → metadata-only
  #   audit (log_analytics_output / ses_mail) → idempotent on redelivery (stable job id).
  # The HANDLER CODE is task 4.3 (NOT this task); this task declares the function RESOURCE so
  # the event-source mapping below has a target. The Handler points at the intended 4.3
  # entrypoint `sam.members.worker.app.handler`, resolved from the SAME vendored MembersLayer
  # (one layer for the module — the worker shares the repository, SES send-path, projection
  # reader, and auth toolkit the edge uses; no second layer).
  MailWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "members-mail-worker-${Stage}"
      # Same empty-package-over-layer pattern as MembersFunction: the module ships in the
      # layer, so CodeUri is the empty `function/` dir and the handler resolves from the
      # layer's `python/sam/members/worker/app.py` (added by task 4.3).
      CodeUri: function/
      Handler: sam.members.worker.app.handler
      Layers:
        - !Ref MembersLayer
      # Match the queue's VisibilityTimeout headroom: VisibilityTimeout (300s) on
      # MailSendQueue must be >= this timeout so a message is not re-driven while a send is
      # still in flight. 120s is ample for one render+SES send and well under the 300s.
      Timeout: 120
      # --- IAM: least-privilege, mirroring MembersFunction's exact-ARN discipline --------
      # The worker's role is DISTINCT from the producer's: it CONSUMES the queue (Receive/
      # Delete/GetQueueAttributes — NOT SendMessage; it never enqueues), SENDS via SES (it is
      # the thing that actually mails), and READS the DynamoDB tables it needs to render +
      # audit. Every Resource is an exact ARN in THIS account/region — no wildcard table, no
      # cross-account (steering 23).
      Policies:
        - Version: "2012-10-17"
          Statement:
            # --- SQS consume: Receive/Delete/GetQueueAttributes on the EXACT queue ARN -----
            # The consumer grant (distinct from the producer's SendMessage on MembersFunction).
            # Lambda's SQS event-source poller needs exactly these three actions to receive a
            # batch, delete it on success, and read queue attributes. Scoped to
            # `!GetAtt MailSendQueue.Arn` — NOT the DLQ: a message lands in the DLQ purely via
            # the queue's RedrivePolicy (task 4.2) after maxReceiveCount failed receives, so the
            # worker needs NO SendMessage to the DLQ (SQS redrive moves it). On a worker failure
            # the batch is simply not deleted → it becomes visible again → retried → DLQ after N.
            - Sid: MailWorkerConsumeQueue
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource:
                - !GetAtt MailSendQueue.Arn
            # --- SES send: same scope + Condition as MembersFunction's MembersSendViaSes -----
            # The worker is what ACTUALLY calls SES (it is the per-tenant sender, mail-spec task
            # 1.3), so the send grant lives HERE too (the producer's copy covers the compose
            # path; both are scoped identically so neither can send as another domain/identity).
            # SendEmail (simple) + SendRawEmail (MIME with CSV/PDF-label attachments, design §4).
            # NO SendBulkEmail (per-recipient fan-out is individual sends, not SES bulk templates
            # — least privilege). PER-TENANT SENDER (task 4.2 — no `jabaki.nl` substitute): the
            # From is `noreply@<tenant-domain>`, so the Resource is the verified tenant DOMAIN
            # identity (`identity/<domain>` from `MailSenderDomain`, which covers `*@<domain>`),
            # and the Condition pins `ses:FromAddress` to exactly `noreply@<domain>`. (The old
            # single-address `identity/support@jabaki.nl` + `== support@jabaki.nl` scope would
            # DENY the per-tenant send — removed here.) SES is nonprofit-deploy (506221081911 /
            # eu-west-1, steering 23).
            - Sid: MailWorkerSendViaSes
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub "arn:aws:ses:${Region}:${AWS::AccountId}:identity/${MailSenderDomain}"
                # A SendEmail/SendRawEmail call that names a ConfigurationSetName is authorized
                # against BOTH the identity AND the configuration-set resource — so the config
                # set this stack owns must be in the Resource list too, else SES returns
                # AccessDenied on `configuration-set/<name>` (mail-spec Phase 7 fix).
                - !Sub "arn:aws:ses:${Region}:${AWS::AccountId}:configuration-set/${SesConfigurationSet}"
              Condition:
                StringEquals:
                  "ses:FromAddress": !Sub "noreply@${MailSenderDomain}"
            # --- DynamoDB read: the projection + the members table, exact ARNs --------------
            # The worker re-reads to render + audit: the governance projection (config#mail gate,
            # sender resolution) and the members table (member rows for per-recipient merge, and
            # the metadata-only audit writes `log_analytics_output` / `ses_mail`). Grant Query/
            # GetItem/BatchGetItem on BOTH (+ the members index), plus the audit WRITE actions on
            # the members table ONLY (the projection stays READ-ONLY — one-way projection, ADR
            # 0005, enforced by the stack-contract test). Resource ARNs are `!Sub`-on-table-name
            # (same as MembersFunction) so TEST (`test_*`) can never touch PROD tables.
            - Sid: MailWorkerReadGovernanceProjection
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${GovernanceProjectionTableName}"
            - Sid: MailWorkerMembersTable
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}"
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}/index/*"
      Environment:
        Variables:
          # Same fail-fast env wiring as MembersFunction (no dangerous defaults) — APP_ENV is
          # DERIVED from Stage so the worker can never drift from the edge within a stack.
          APP_ENV: !FindInMap [StageToAppEnv, !Ref Stage, AppEnv]
          MEMBERS_TABLE: !Ref MembersTableName
          GOVERNANCE_PROJECTION_TABLE: !Ref GovernanceProjectionTableName
          # Local-only DynamoDB endpoint override (empty in prod; the client only overrides
          # when non-blank). Declared so `sam local`/tests can inject it, same as the edge.
          AWS_ENDPOINT_URL_DYNAMODB: !Ref DynamoDbEndpointUrl
          # SES send config — the worker is the SES caller. There is NO `SES_SENDER_EMAIL` env
          # var (mail-spec task 1.2/4.2): the From is `noreply@<tenant-domain>` resolved PER SEND
          # and passed into the adapter (task 1.3), not read from the env — the single global
          # sender (and its `jabaki.nl` substitute) is gone from the code path. WHO the worker may
          # send AS is enforced by the IAM `MailWorkerSendViaSes` grant above (verified tenant
          # DOMAIN identity + `ses:FromAddress = noreply@<domain>`). SES_CONFIGURATION_SET is the
          # only SES env the adapter still reads; attached per send only when non-blank (same
          # contract as the Flask `ses_email_service.py`).
          SES_CONFIGURATION_SET: !Ref SesConfigurationSet
          # NOTE: no MAIL_SEND_QUEUE_URL here — the worker CONSUMES via the event-source
          #       mapping below (SQS pushes to it), it does not enqueue.
          # NOTE: AWS_REGION is Lambda-reserved (auto-populated from the deploy region); the
          #       fail-fast require_env("AWS_REGION") in dynamodb_client.py is satisfied without
          #       (and cannot carry) an explicit declaration — same as MembersFunction.
      Events:
        # --- Event-source mapping: drain MailSendQueue, BOUNDED concurrency ---------------
        # Wires the worker to consume MailSendQueue (design §4.2 "SQS event source, bounded
        # concurrency"). SAM turns this into an AWS::Lambda::EventSourceMapping targeting the
        # worker.
        #   * BatchSize 1 — one job per invocation. The design fans per_recipient out to one
        #     job PER member, so a 1-message batch keeps the idempotency/dedupe (stable job id)
        #     and the per-send SES-throttle handling simple: a failed send fails exactly its own
        #     message (no partial-batch bookkeeping), and that single message retries → DLQ.
        #   * ScalingConfig.MaximumConcurrency — the BOUNDED drain: SQS drives at most
        #     `MailWorkerMaxConcurrency` (default 10) concurrent invocations, holding the drain
        #     rate under the granted SES send rate (14/s, design §6.4) so per-recipient fan-out
        #     cannot trip the SES throttle. Re-tunable per env without code (design §12).
        MailSendQueueSource:
          Type: SQS
          Properties:
            Queue: !GetAtt MailSendQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: !Ref MailWorkerMaxConcurrency

  # --- The SES-feedback ingestion Lambda: the SNS CONSUMER (mail task 5.2, R8.4/R9.5) -------
  # The CONSUMER side of the SES -> SNS feedback pipeline the task-5.1 infra wired (above):
  # `MembersSesConfigurationSet`'s event destination publishes bounce/complaint/delivery events
  # to `MembersMailFeedbackTopic`; THIS function is SUBSCRIBED to that topic and routes each
  # event back to the Members store by the message tags the send-path stamps (ms_tenant/ms_run)
  # — SES has no module/tenant/run concept (R9.5), so the tag is the matching key. A FAILURE
  # (bounce/complaint) CREATES a FAILURE-ONLY `mailrecipient#` sub-record (a late bounce has none
  # yet) + moves the `mailrun#` tally sent->failed; a delivery is informational (no-op, R9.4).
  #
  # Thin entrypoint `sam.members.worker.mail_feedback_app.handler` (task 5.2), resolved from the
  # SAME vendored MembersLayer (one layer for the module — it shares the repository + domain).
  # Its role is DISTINCT + least-privilege: it does NOT send via SES, does NOT touch SQS, does
  # NOT read/manage schedules. It only WRITES the mailrun/mailrecipient status records on the
  # members table (and reads them to compute the tally delta / failure sequence). The topic
  # subscription (SNS event source) + the SNS->Lambda invoke permission are declared here (task
  # 5.1 explicitly left the subscription of THIS handler to task 5.2).
  MailFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "members-mail-feedback-${Stage}"
      # Same empty-package-over-layer pattern as MembersFunction / MailWorkerFunction.
      CodeUri: function/
      Handler: sam.members.worker.mail_feedback_app.handler
      Layers:
        - !Ref MembersLayer
      # One SES notification per invocation is a quick read-modify-write of the tally + a
      # sub-record put; 60s is ample (well under any SNS delivery concern).
      Timeout: 60
      # --- IAM: least-privilege, mirroring the worker's exact-ARN discipline ----------------
      # The ingestion role WRITES the status records (mailrun#/mailrecipient#) and READS them to
      # compute the tally delta — nothing else. It does NOT send SES, does NOT touch SQS, does
      # NOT touch the projection. Every Resource is an exact ARN in THIS account/region.
      Policies:
        - Version: "2012-10-17"
          Statement:
            # --- DynamoDB: READ + WRITE the mailrun/mailrecipient records on the members table --
            # `record_mail_failure` does a GetItem (the current run tally, for the failure
            # sequence + the sent->failed delta), a Query (existing failures when the tally is
            # absent), and PutItem/UpdateItem (the new mailrecipient# sub-record + the adjusted
            # mailrun# tally). Scoped to the EXACT members-table ARN (+ its index) via !Sub on the
            # table-name param — no wildcard table, no cross-account, so a TEST feedback handler
            # (resolved to `test_*`) can never touch PROD. NO projection access (the ingestion
            # path needs no config#mail / sender resolution — the tenant rides on the SES tag).
            - Sid: MailFeedbackWriteStatusRecords
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}"
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}/index/*"
      Environment:
        Variables:
          # Same fail-fast env wiring as MembersFunction/MailWorkerFunction — APP_ENV DERIVED from
          # Stage so the handler can never drift from the edge/worker within a stack.
          APP_ENV: !FindInMap [StageToAppEnv, !Ref Stage, AppEnv]
          MEMBERS_TABLE: !Ref MembersTableName
          # Local-only DynamoDB endpoint override (empty in prod; the client only overrides when
          # non-blank). Declared so `sam local`/tests can inject it, same as the edge/worker.
          AWS_ENDPOINT_URL_DYNAMODB: !Ref DynamoDbEndpointUrl
          # NOTE: NO GOVERNANCE_PROJECTION_TABLE / SES_* / MAIL_SEND_QUEUE_URL — the ingestion
          #       path only writes the members-table status records; it reads the tenant/run from
          #       the SES message tags on the event, not from the projection or any SES/SQS call.
          # NOTE: AWS_REGION is Lambda-reserved (auto-populated from the deploy region); the
          #       fail-fast require_env("AWS_REGION") in dynamodb_client.py is satisfied without
          #       (and cannot carry) an explicit declaration — same as the other functions.
      Events:
        # --- SNS event source: subscribe to the Members SES-feedback topic (R8.4/R9.5) --------
        # SAM turns this into an AWS::SNS::Subscription (Protocol lambda) on the task-5.1
        # MembersMailFeedbackTopic PLUS the AWS::Lambda::Permission letting SNS invoke this
        # function. This is the subscription task 5.1 explicitly deferred to task 5.2. SNS -> Lambda
        # has NO partial-batch response — the handler surfaces an unroutable event in its return/log
        # (never a silent drop) and lets a real store fault propagate so SNS retries.
        MailFeedbackTopicSource:
          Type: SNS
          Properties:
            Topic: !Ref MembersMailFeedbackTopic

  # ===========================================================================
  # EventBridge Scheduler plumbing (R5, pivot-output-actions task 5.3) ---------
  # ===========================================================================
  # The scheduled send path (R5, design §4.3/§5): a saved set + delivery runs on a schedule,
  # REUSING the R4 execute-and-deliver path so there is ONE send path for interactive +
  # scheduled. Schedules are DYNAMIC — one EventBridge Scheduler schedule per stored
  # `schedule#<id>` record, created at RUNTIME by the task-5.2 CRUD path via the Scheduler API
  # (repository/scheduler_api.EventBridgeSchedulerApi). They CANNOT be declared statically here
  # (tenant/user data, an unknown growing set), so this template declares only the FIXED
  # plumbing those runtime schedules need:
  #   * MembersScheduleGroup — the per-env schedule GROUP the runtime schedules are created in.
  #   * MembersSchedulerTriggerFunction — the dedicated trigger entrypoint EventBridge invokes
  #     when a schedule fires (a DISTINCT event shape from the API-GW proxy event — a dedicated
  #     Lambda keeps each entrypoint thin, steering 35).
  #   * MembersSchedulerExecutionRole — the role EventBridge Scheduler assumes to invoke that
  #     trigger (scheduler-to-Lambda invoke permission, exact-ARN).
  #   * the MembersFunction `scheduler:*` + `iam:PassRole` grant (added to its policy above) so
  #     the task-5.2 CRUD path (which runs IN MembersFunction) can create/update/delete the
  #     runtime schedules in the group and pass the execution role.
  # EventBridge Scheduler is a nonprofit-deploy service (506221081911 / eu-west-1, steering 23).

  # --- The schedule-group the runtime per-schedule schedules live in (R5) ----
  # A named bucket so (a) a tenant's runtime schedules are grouped per env and (b) the Members
  # function's `scheduler:*` grant scopes to exactly this group's ARN (schedules created inside
  # it), never account-wide. The group itself is static infra; the schedules inside it are
  # created at runtime by task 5.2.
  MembersScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Ref SchedulerGroupName

  # --- The scheduler-trigger Lambda: the firing ENTRYPOINT (R5, task 5.3) ----
  # EventBridge Scheduler invokes THIS function (not the HTTP MembersFunction) when a schedule
  # fires, with the static JSON payload `{source: members.schedule, tenant_id, schedule_id}`
  # (repository/scheduler_api.build_schedule_target_input). The handler resolves the record,
  # confirms it is enabled, audits the UNATTENDED run, and reuses the SAME execute-and-deliver
  # service the `deliver` route uses — enqueuing to the SAME MailSendQueue. A DEDICATED
  # entrypoint (distinct from the HTTP handler) keeps both thin (steering 35); it ships in the
  # SAME vendored MembersLayer (one layer for the module — it shares the repository, the
  # execute-and-deliver service, and the audit sink). As the PRODUCER of send jobs it needs the
  # SAME `sqs:SendMessage` + DynamoDB (read set/rows, read schedule record) grants the HTTP edge
  # has; it does NOT send via SES (the worker does) and does NOT manage schedules (task 5.2 in
  # the HTTP edge does), so NO ses:* / scheduler:* here — least privilege.
  MembersSchedulerTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "members-scheduler-trigger-${Stage}"
      # Same empty-package-over-layer pattern as MembersFunction / MailWorkerFunction: the module
      # ships in the layer, so CodeUri is the empty `function/` dir and the handler resolves from
      # the layer's `python/sam/members/handler/scheduler_app.py`.
      CodeUri: function/
      Handler: sam.members.handler.scheduler_app.handler
      Layers:
        - !Ref MembersLayer
      # The trigger resolves the schedule, re-fetches the tenant's rows, runs the pivot, and
      # ENQUEUES send jobs — the SAME work the `deliver` route does, so it needs the SAME
      # producer-side grants: DynamoDB read on the members table (schedule record + member rows)
      # and SQS send on the exact queue. Every Resource is an exact ARN in THIS account/region
      # (steering 23) — no wildcard table, no cross-account.
      Policies:
        - Version: "2012-10-17"
          Statement:
            # DynamoDB read: the members table (the schedule#<id> record + the member rows for
            # the re-fetch) + its index. No projection read needed (the run is tenant-wide — the
            # create-time gate owns scope, R5 — so no scope-grant lookup at fire time). !Sub on
            # the table-name param (same env-isolation guarantee as the edge/worker).
            - Sid: SchedulerTriggerReadMembersTable
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
              Resource:
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}"
                - !Sub "arn:aws:dynamodb:${Region}:${AWS::AccountId}:table/${MembersTableName}/index/*"
            # SQS send: enqueue to the EXACT MailSendQueue ARN (the PRODUCER grant, same as the
            # HTTP edge's MembersEnqueueMailSend — the scheduled run and the interactive deliver
            # share one queue, R4/R5). SendMessage only (never Receive/Delete — that is the
            # worker); not the DLQ.
            - Sid: SchedulerTriggerEnqueueMailSend
              Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !GetAtt MailSendQueue.Arn
      Environment:
        Variables:
          # Same fail-fast env wiring as the edge/worker — APP_ENV derived from Stage (no drift).
          APP_ENV: !FindInMap [StageToAppEnv, !Ref Stage, AppEnv]
          MEMBERS_TABLE: !Ref MembersTableName
          GOVERNANCE_PROJECTION_TABLE: !Ref GovernanceProjectionTableName
          AWS_ENDPOINT_URL_DYNAMODB: !Ref DynamoDbEndpointUrl
          # The trigger enqueues to the SAME queue as the deliver route (R4/R5) — it needs the
          # queue URL for the producer path (resolve_mail_send_queue_url → require_env). The
          # `sqs:SendMessage` grant above is scoped to this same queue's ARN, so env + grant
          # cannot disagree.
          MAIL_SEND_QUEUE_URL: !Ref MailSendQueue
          # NOTE: no SES / scheduler env here — the trigger neither sends via SES (the worker
          #       does) nor manages schedules (the HTTP edge's task-5.2 path does).

  # --- The role EventBridge Scheduler assumes to invoke the trigger (R5) -----
  # EventBridge Scheduler needs a role it can assume (`scheduler.amazonaws.com`) to invoke the
  # target. Scoped exactly: the trust policy allows ONLY the scheduler service principal (with a
  # SourceAccount condition so only THIS account's scheduler can assume it — the AWS-recommended
  # confused-deputy guard), and the single inline permission is `lambda:InvokeFunction` on EXACTLY
  # the trigger function ARN (no wildcard). The MembersFunction's `iam:PassRole` grant below is
  # scoped to exactly THIS role's ARN, so the task-5.2 CRUD path can only ever pass this one role
  # when it creates a schedule.
  MembersSchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "members-scheduler-exec-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
      Policies:
        - PolicyName: InvokeSchedulerTrigger
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeMembersSchedulerTrigger
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt MembersSchedulerTriggerFunction.Arn

  # ===========================================================================
  # SES feedback: configuration set -> SNS event destination (R8.4/R9.5, task 5.1)
  # ===========================================================================
  # POST-SEND outcome detection (R8.4): SES ACCEPTS a message (MessageId) but it can later
  # BOUNCE or be marked a COMPLAINT — "sent OK but never arrived". That outcome is only
  # observable via an SES CONFIGURATION SET whose EVENT DESTINATION publishes bounce/complaint/
  # delivery events to a notification sink. This block is that infra for the MEMBERS plane:
  #
  #   MembersSesConfigurationSet       — the config set the send-path attaches per send
  #                                      (its Name == !Ref SesConfigurationSet, the same value
  #                                      the sender reads from SES_CONFIGURATION_SET).
  #   MembersMailFeedbackTopic         — the ONE account-level SNS sink SES publishes to.
  #   MembersMailFeedbackTopicPolicy   — lets SES (this account only) publish to that topic.
  #   MembersSesEventDestination       — wires bounce/complaint/delivery -> the SNS topic.
  #
  # PLANE (R9.5, decided — rule 5a): SES has no module concept, so it publishes to ONE
  # account-level SNS sink per config set. The task-5.2 ingestion handler (NOT built here —
  # it SUBSCRIBES to `MembersMailFeedbackTopicArn`, see Outputs) routes each event to the
  # Members' OWN DynamoDB table by matching back on `run_id` / message tag, recording the
  # outcome against the Members `mailrun#`/`mailrecipient#` records. This is DISTINCT from the
  # Flask-side `infrastructure/ses.tf` `myadmin-emails` set + `myadmin-ses-delivery` topic:
  # that lives in the PERSONAL account and forwards to the Flask webhook for ZZP/invoice mail;
  # the Members plane owns its OWN set + topic HERE in nonprofit-deploy (same PATTERN, own
  # PLANE). A config set is account+region scoped, so there is no reuse across accounts.
  #
  # ACCOUNT (steering 23): SES/SNS are nonprofit-deploy services (506221081911 / eu-west-1),
  # the SAME account as the rest of this stack. Per-env: TEST and PROD are distinct
  # CloudFormation stacks, so each gets its OWN config set (`members-emails[-test]`) + topic
  # (`members-mail-feedback[-test]`) — no cross-env sharing (mirrors the table/queue isolation).
  #
  # ============================= DEFERRED OPERATOR / DEPLOY (Phase 7.4) =======================
  # This task writes the IaC ONLY — it does NOT deploy (steering 41/43: infra is operator-run,
  # deploys happen on GitHub via OIDC, never local). The live wiring is mail-spec task 7.4
  # ("If P5, wire the SES configuration set + SNS"):
  #   1. The config set + topic + event destination come into existence on the TEST stack
  #      deploy (task 7.1, `Deploy SAM Members` via OIDC) — not before.
  #   2. SES only publishes feedback for a send that ATTACHES this config set — already wired:
  #      the send-path attaches `SES_CONFIGURATION_SET` (= this set's name) per send.
  #   3. The task-5.2 ingestion handler must SUBSCRIBE to `MembersMailFeedbackTopicArn` (its
  #      SQS/Lambda subscription is added by task 5.2, NOT here) before events are consumed.
  #   4. OPERATOR confirms feedback is live (task 7.9: a TEST bounce appears against the run).
  # ===========================================================================================

  # --- The SNS topic SES publishes bounce/complaint/delivery events to (R8.4) -
  # ONE account-level sink per config set (R9.5). The task-5.2 handler subscribes to it; its
  # ARN is a stack Output so 5.2 (and the operator) can discover it without a console lookup.
  # Per-env name from the fail-fast `MailFeedbackTopicName` param (same discipline as the send
  # queue's name): `members-mail-feedback` (prod) / `members-mail-feedback-test` (test), supplied
  # per env via samconfig.toml so TEST and PROD each own a distinct topic (no cross-env sharing).
  MembersMailFeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Ref MailFeedbackTopicName
      DisplayName: !Sub "Members mail feedback (bounce/complaint/delivery) - ${Stage}"

  # --- Topic policy: allow ONLY SES in THIS account to publish (least privilege) ------------
  # SES needs SNS:Publish to deliver event notifications to the topic. Scoped to the
  # `ses.amazonaws.com` service principal, this exact topic ARN, and an `AWS:SourceAccount`
  # Condition pinning THIS account (the AWS-recommended confused-deputy guard, mirrors the
  # Flask `aws_sns_topic_policy.ses_delivery_policy` in infrastructure/ses.tf). No other
  # principal, no cross-account publish.
  MembersMailFeedbackTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref MembersMailFeedbackTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSESPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: "sns:Publish"
            Resource: !Ref MembersMailFeedbackTopic
            Condition:
              StringEquals:
                "AWS:SourceAccount": !Ref "AWS::AccountId"

  # --- The SES configuration set the send-path attaches per send (R8.4) -------
  # Its Name is `!Ref SesConfigurationSet` — EXACTLY the value the sender attaches via the
  # `SES_CONFIGURATION_SET` env var (both MembersFunction + MailWorkerFunction) — so "the set
  # the sender names" and "the set that owns the SNS event destination" are the SAME set and
  # cannot disagree. Account+region scoped (nonprofit-deploy / eu-west-1).
  MembersSesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref SesConfigurationSet

  # --- Event destination: publish bounce/complaint/delivery -> the SNS topic (R8.4) ---------
  # The actual R8.4 wiring: the config set's event destination forwards exactly the three
  # outcome event types the design calls for — BOUNCE, COMPLAINT, DELIVERY — to the Members
  # feedback SNS topic. (We do NOT subscribe OPEN/CLICK/SEND/REJECT: the Members status model
  # (R9.4) tracks SES-accepted at send time already; this layer adds only the true per-recipient
  # delivered/bounced/complaint outcomes the core view cannot know — least surface.) `Enabled:
  # true` so events flow as soon as the stack deploys (Phase 7.4) and a send attaches the set.
  MembersSesEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref MembersSesConfigurationSet
      EventDestination:
        Name: members-mail-feedback
        Enabled: true
        MatchingEventTypes:
          - bounce
          - complaint
          - delivery
        SnsDestination:
          TopicARN: !Ref MembersMailFeedbackTopic

  # --- The API Gateway --------------------------------------------------------
  # ANY /{proxy+} + ANY /. The API declares a Cognito authorizer as its
  # `DefaultAuthorizer`, which is the prod gate (R6.1 — Cognito authorizer in prod;
  # supply the real pool ARN via `CognitoUserPoolArn` at prod deploy). Locally,
  # `sam local start-api` does NOT enforce API Gateway authorizers — it invokes the
  # function directly — so the local run is unaffected. Either way the module edge
  # additionally + authoritatively verifies the bearer token itself
  # (`get_verified_claims`, ADR 0004 — there is no unverified path).
  MembersApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        # CORS preflight fix: the CORS OPTIONS method that SAM auto-generates must NOT
        # be gated by the Cognito authorizer. Browsers send preflight OPTIONS with NO
        # Authorization header (per the Fetch/CORS spec), so if the DefaultAuthorizer
        # applies to it the preflight returns 401 with no CORS headers, and the browser
        # blocks EVERY real request (surfaced as "no members shown", all Members API
        # calls failing at preflight — verified live: OPTIONS /prod/members -> 401
        # UnauthorizedException, no Access-Control-* headers). Setting this to false lets
        # the preflight return the CORS headers below UNauthenticated, while every REAL
        # method (GET/POST/PUT/PATCH/DELETE) STILL requires a valid Cognito token. This
        # is the AWS-recommended setting for an authorized API with browser clients — it
        # does NOT weaken auth (real calls still gated) and does NOT weaken CORS (the
        # AllowOrigin/Methods/Headers rules below still apply).
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Tenant,X-Language'"
        AllowOrigin: "'*'"

Outputs:
  MembersFunctionArn:
    Description: ARN of the Members Lambda.
    Value: !GetAtt MembersFunction.Arn

  MailWorkerFunctionArn:
    Description: >-
      ARN of the mail-send worker Lambda (R4) — the queue CONSUMER wired to MailSendQueue via
      the event-source mapping, draining at bounded concurrency under the SES rate.
    Value: !GetAtt MailWorkerFunction.Arn

  MailFeedbackFunctionArn:
    Description: >-
      ARN of the SES-feedback ingestion Lambda (mail task 5.2, R8.4/R9.5) — the SNS CONSUMER
      subscribed to MembersMailFeedbackTopic that routes bounce/complaint/delivery events back to
      the Members mailrun#/mailrecipient# records by the stamped ms_tenant/ms_run message tags.
    Value: !GetAtt MailFeedbackFunction.Arn

  MembersLayerArn:
    Description: ARN of the Members runtime layer.
    Value: !Ref MembersLayer

  MembersApiBaseUrl:
    Description: >-
      Base URL of the Members API (feeds the SPA's MEMBERS_API_BASE_URL). Locally
      `sam local start-api` serves on http://127.0.0.1:3000 regardless of this output.
    Value: !Sub "https://${MembersApi}.execute-api.${Region}.amazonaws.com/${Stage}"

  MailSendQueueUrl:
    Description: >-
      URL of the SQS mail-send queue (R4) — the value wired into the Members function as
      MAIL_SEND_QUEUE_URL. The worker/event-source mapping (task 4.4) consumes this same queue.
    Value: !Ref MailSendQueue

  MailSendQueueArn:
    Description: ARN of the SQS mail-send queue (R4) — the IAM send grant is scoped to exactly this.
    Value: !GetAtt MailSendQueue.Arn

  MailSendDeadLetterQueueArn:
    Description: ARN of the SQS mail-send DLQ (R4) — redrive target after maxReceiveCount receives.
    Value: !GetAtt MailSendDeadLetterQueue.Arn

  MembersSchedulerTriggerFunctionArn:
    Description: >-
      ARN of the scheduler-trigger Lambda (R5) — the firing entrypoint EventBridge Scheduler
      invokes per schedule; wired into the Members function as SCHEDULER_TARGET_FUNCTION_ARN.
    Value: !GetAtt MembersSchedulerTriggerFunction.Arn

  MembersSchedulerExecutionRoleArn:
    Description: >-
      ARN of the role EventBridge Scheduler assumes to invoke the trigger (R5) — the Members
      function's iam:PassRole grant is scoped to exactly this, and it is wired in as
      SCHEDULER_EXECUTION_ROLE_ARN.
    Value: !GetAtt MembersSchedulerExecutionRole.Arn

  MembersScheduleGroupName:
    Description: >-
      Name of the EventBridge Scheduler schedule-group the runtime per-schedule schedules (R5)
      are created in — the Members function's scheduler:* grant is scoped to this group's ARN.
    Value: !Ref MembersScheduleGroup

  SesConfigurationSetName:
    Description: >-
      Name of the Members SES configuration set this stack owns (mail task 5.1, R8.4) — the set
      the send-path attaches per send (SES_CONFIGURATION_SET) and whose SNS event destination
      publishes bounce/complaint/delivery events. Per env: members-emails[-test].
    Value: !Ref MembersSesConfigurationSet

  MailFeedbackTopicArn:
    Description: >-
      ARN of the SNS topic the Members SES configuration set publishes bounce/complaint/delivery
      events to (mail task 5.1, R8.4/R9.5). DISCOVERABLE here so the task-5.2 ingestion handler
      (NOT built in 5.1) can subscribe its handler — the subscription is added by task 5.2, not
      here. The task-5.2 handler routes each event to the Members store by run_id/message tag.
    Value: !Ref MembersMailFeedbackTopic

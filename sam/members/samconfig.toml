# samconfig.toml — pinned SAM deploy config for the Members module (A.7).
#
# Makes `sam deploy` reproducible: the prod stack name, region, capabilities, and the
# fail-fast parameter_overrides live here instead of inline flags, so the CI workflow
# (deploy-sam-members.yml, plan B.3) and a manual `sam deploy --config-env prod` produce
# the SAME stack. Deploys to the DATA account (nonprofit-deploy / 506221081911, eu-west-1)
# via GitHub OIDC (NonprofitDeployRole) — see the rollout plan B.3. NO secrets here; the
# Cognito identifiers below are PUBLIC (pool id / app-client id / JWKS URL).
#
# IMPORTANT (isolation): the stack name is `sam-members`, deliberately NOT `h-dcn` — the
# existing h-dcn app owns the `h-dcn` stack in the same account; a distinct name keeps the
# two CloudFormation stacks independent (see the plan's "Isolation from the existing h-dcn
# app"). The `sam-members` + `governance_projection` tables are managed OUTSIDE this stack
# (Retain); a deploy never creates/replaces them.
#
# COGNITO: the API authorizer + verified-auth edge use the **myAdmin** pool
# `eu-west-1_Hdp40eWmu` in the PERSONAL account (344561557829) — NOT the h-dcn pool. The
# authorizer references it cross-account by ARN (no cross-account role needed). The
# `MyAdminCognito*` values are the pool-registry entry (key `MYADMIN`) the edge verifies
# tokens against.

version = 0.1

# --- PROD (data account 506221081911, eu-west-1) --------------------------------------
[prod.deploy.parameters]
stack_name = "sam-members"
region = "eu-west-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = [
  "Stage=prod",
  "MembersTableName=sam-members",
  "GovernanceProjectionTableName=governance_projection",
  "Region=eu-west-1",
  "CognitoUserPoolArn=arn:aws:cognito-idp:eu-west-1:344561557829:userpool/eu-west-1_Hdp40eWmu",
  # Verified-auth edge pool registry (key MYADMIN) — the myAdmin pool, PUBLIC identifiers.
  "CognitoPoolKeys=MYADMIN",
  "MyAdminCognitoIssuer=https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_Hdp40eWmu",
  "MyAdminCognitoJwksUri=https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_Hdp40eWmu/.well-known/jwks.json",
  "MyAdminCognitoClientId=66tp0087h9tfbstggonnu5aghp",
  "MyAdminCognitoPoolLabel=myAdmin",
  # --- SES send config (R4.1/R4.2, mail task 4.2) — nonprofit-deploy (506221081911) / eu-west-1 ---
  # MailSenderDomain: the VERIFIED tenant mail DOMAIN this stack env is authorized to send
  #   `From` as `noreply@<domain>` (the per-tenant sender model — there is NO `jabaki.nl`
  #   substitute sender any more, R4.2). The template parameter has NO default (fail-fast), so
  #   it MUST be supplied here or the deploy fails loudly. The IAM `MembersSendViaSes` /
  #   `MailWorkerSendViaSes` statements are Resource-scoped to this domain's `identity/<domain>`
  #   ARN AND Condition-scoped on `ses:FromAddress = noreply@<domain>`, so the grant and this
  #   value cannot disagree — the role can only send AS `noreply@<this-domain>`.
  #   `h-dcn.nl` is the first/only certified tenant domain today.
  #   OPERATOR (deferred — task 4.2 report + Phase 7): the domain named here MUST be a VERIFIED
  #   SES DOMAIN identity in nonprofit-deploy / eu-west-1 (mail task 7.2 re-confirms h-dcn.nl is
  #   `VerifiedForSendingStatus:true`). When ADDITIONAL tenants are certified, broadening the
  #   send grant to their domains is an explicit operator change (add the verified domain) — NOT
  #   a wildcard identity. Do NOT revert to a single `support@jabaki.nl` address.
  "MailSenderDomain=h-dcn.nl",
  # SesConfigurationSet: the SES configuration set applied per send AND owned by this stack
  #   (mail-spec task 5.1, R8.4). Its SNS event destination publishes bounce/complaint/delivery
  #   events to the Members feedback topic the task-5.2 ingestion handler consumes. CHANGED from
  #   the Flask-side `myadmin-emails` (task 5.1): that set lives in the PERSONAL account
  #   (344561557829) and forwards to the Flask webhook for ZZP mail, but the Members plane sends
  #   from nonprofit-deploy (506221081911) and a config set is account+region scoped — so the
  #   Members plane owns its OWN set here. Per-env name, template param is fail-fast (no default)
  #   so it MUST be supplied. The resource's Name and the sender's SES_CONFIGURATION_SET env var
  #   are both this value, so they cannot disagree.
  "SesConfigurationSet=members-emails",
  # --- SES feedback SNS topic (R8.4/R9.5, mail task 5.1) — the PROD topic name ---
  # The ONE account-level sink the config set above publishes bounce/complaint/delivery events
  # to; the task-5.2 ingestion handler subscribes to it (its ARN is the MailFeedbackTopicArn
  # output) and routes each event to the Members store by run_id/tag. Template param is
  # fail-fast (no default) so it MUST be supplied. SNS is a nonprofit-deploy service
  # (506221081911 / eu-west-1). OPERATOR/DEPLOY (deferred — Phase 7.4): this topic + the config
  # set come into existence on the TEST/PROD stack deploy (OIDC, never local); confirming SES
  # feedback is live is mail task 7.4/7.9.
  "MailFeedbackTopicName=members-mail-feedback",
  # --- SQS mail-send queue (R4, task 4.2) — the PROD send-queue name ---
  # The queued send path (R4): the `deliver` route + the R5 scheduler enqueue here; the worker
  # (task 4.4) drains it. The template parameter has NO default (fail-fast), so it MUST be
  # supplied. The DLQ is derived as `members-mail-send-dlq`; the function's MAIL_SEND_QUEUE_URL
  # env var + the `sqs:SendMessage` IAM grant are scoped to exactly this queue's ARN.
  "MailSendQueueName=members-mail-send",
  # --- Worker drain concurrency (R4, task 4.4 — the CONSUMER side) ---
  # The BOUNDED max concurrent mail-worker invocations SQS drives (ScalingConfig.
  # MaximumConcurrency). 10 holds the drain rate under the granted SES send rate (14/s, design
  # §6.4) with headroom for the SES burst allowance and the Flask-plane prod SES sharing this
  # account. Matches the template default; set explicitly here so PROD's drain rate is pinned
  # in config (steering 43) and re-tunable per env once production SES access lands (design §12).
  "MailWorkerMaxConcurrency=10",
  # --- EventBridge Scheduler schedule-group (R5, task 5.3) — the PROD group name ---
  # The scheduled send path (R5): schedules are DYNAMIC (one EventBridge schedule per
  # `schedule#<id>` record, created at runtime by task 5.2). This names the per-env GROUP those
  # runtime schedules are created in; the Members function's `scheduler:*` grant is scoped to
  # exactly this group's ARN pattern. Template parameter has NO default (fail-fast), so it MUST
  # be supplied. EventBridge Scheduler is a nonprofit-deploy service (506221081911 / eu-west-1).
  "SchedulerGroupName=members-schedules",
  # SECRET — NOT here (steering 43 "no secrets in CI"): `OpenRouterApiKey` (the Members
  # AI-improve key, R2 task 2.4) is a NoEcho template parameter with NO default + an
  # `sk-or-v1-` AllowedPattern. It is supplied at DEPLOY time only, appended by the OIDC
  # deploy workflow from the environment's secret store, e.g.:
  #     sam deploy --config-env prod \
  #       --parameter-overrides "OpenRouterApiKey=${OPENROUTER_API_KEY}"
  # (the var comes from a GitHub Environment secret, never committed). `MembersAiModel`
  # may also be overridden the same way; it defaults to the free router in the template.
  # Do NOT add the key to this file — a missing override fails the deploy loudly.
  # NOTE: DynamoDbEndpointUrl is LOCAL-ONLY and defaults to "" in template.yaml, so it is
  # intentionally OMITTED here — passing `DynamoDbEndpointUrl=` (empty) is rejected by the
  # SAM CLI parameter_overrides parser. Omitting it => the template's empty default => the
  # DynamoDB client talks to real AWS (no endpoint override). Do NOT re-add an empty entry.
]

# --- TEST (data account 506221081911, eu-west-1) --------------------------------------
# The TEST stack is a FULL sibling of prod — its own CloudFormation stack
# (`test_sam-members`), its own TEST API Gateway (distinct invoke URL), its own
# `test_`-prefixed DynamoDB tables, and the TEST Cognito pool as the authorizer. It
# deploys to the SAME data account as prod (506221081911) via the same OIDC role; the
# environment boundary is the `test_` table prefix + the test pool, NOT a separate
# account. `Stage=test` makes the Lambda carry APP_ENV=test (StageToAppEnv mapping) and
# names every resource `members-test`, so TEST and PROD cannot collide or drift.
#
# COGNITO (TEST): the authorizer + verified-auth edge use the **myAdmin-test** pool
# `eu-west-1_xyrlzfqbl` in the PERSONAL account (344561557829) — the test app-client
# `43s15cm8qcgg8an85udt0e087u` (no client secret, Req 8.4). PUBLIC identifiers only.
#
# TABLES (TEST): `test_sam-members` (member CRUD) + `test_governance_projection` (scope
# config/grants). There is NO shared projection with prod — the TEST projection is its
# own table, populated operationally (local-Docker seed or a one-way PROD->TEST copy),
# because a projection can legitimately deviate over time (user decision).
[test.deploy.parameters]
stack_name = "test-sam-members"  # CFN stack names forbid underscores; the TABLE stays test_sam-members
region = "eu-west-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = [
  "Stage=test",
  "MembersTableName=test_sam-members",
  "GovernanceProjectionTableName=test_governance_projection",
  "Region=eu-west-1",
  "CognitoUserPoolArn=arn:aws:cognito-idp:eu-west-1:344561557829:userpool/eu-west-1_xyrlzfqbl",
  # Verified-auth edge pool registry (key MYADMIN) — the myAdmin-TEST pool, PUBLIC identifiers.
  "CognitoPoolKeys=MYADMIN",
  "MyAdminCognitoIssuer=https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_xyrlzfqbl",
  "MyAdminCognitoJwksUri=https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_xyrlzfqbl/.well-known/jwks.json",
  "MyAdminCognitoClientId=43s15cm8qcgg8an85udt0e087u",
  "MyAdminCognitoPoolLabel=myAdmin-test",
  # --- SES send config (R4.1/R4.2, mail task 4.2) — nonprofit-deploy (506221081911) / eu-west-1 ---
  # Same account/region as prod (the environment boundary is the `test_` table prefix + the
  # test pool, NOT a separate account), so TEST sends as the SAME per-tenant `noreply@<domain>`
  # and config set — there is NO `jabaki.nl` substitute sender (R4.2). MailSenderDomain has NO
  # template default (fail-fast) — it MUST be supplied. The IAM send statements are scoped to
  # this domain's `identity/<domain>` ARN + `ses:FromAddress = noreply@<domain>`, so the TEST
  # role can only send AS `noreply@h-dcn.nl`. (mail task 7.2 re-confirms h-dcn.nl is a VERIFIED
  # SES domain identity in nonprofit-deploy before the TEST end-to-end send.)
  "MailSenderDomain=h-dcn.nl",
  # SesConfigurationSet (mail task 5.1): the TEST sibling of the owned Members config set —
  #   `members-emails-test` (NOT the Flask `myadmin-emails`, which is in the PERSONAL account).
  #   Its SNS event destination publishes bounce/complaint/delivery to the TEST feedback topic.
  "SesConfigurationSet=members-emails-test",
  # --- SES feedback SNS topic (R8.4/R9.5, mail task 5.1) — the TEST topic name ---
  # TEST sibling of the prod feedback topic (same account; the environment boundary is the
  # `-test` suffix). The runtime SES bounce/complaint/delivery events for TEST sends land here;
  # the task-5.2 handler subscribes to it (MailFeedbackTopicArn output). Fail-fast — no default.
  "MailFeedbackTopicName=members-mail-feedback-test",
  # --- SQS mail-send queue (R4, task 4.2) — the TEST send-queue name ---
  # TEST sibling of the prod queue; the DLQ is derived as `members-mail-send-test-dlq`.
  "MailSendQueueName=members-mail-send-test",
  # --- Worker drain concurrency (R4, task 4.4 — the CONSUMER side) ---
  # TEST drains SLOWER than prod (4 vs 10): TEST shares the nonprofit-deploy account's SES
  # send budget with prod, so a TEST run must not starve prod of the 14/s rate. Still >= the
  # SQS MaximumConcurrency floor (2). Re-tunable per env (steering 43).
  "MailWorkerMaxConcurrency=4",
  # --- EventBridge Scheduler schedule-group (R5, task 5.3) — the TEST group name ---
  # TEST sibling of the prod group (same account; the environment boundary is the `test`
  # suffix). The runtime schedules task 5.2 creates for TEST land in this group; the Members
  # function's `scheduler:*` grant is scoped to it. NO template default (fail-fast).
  "SchedulerGroupName=members-schedules-test",
  # SECRET — NOT here (steering 43): `OpenRouterApiKey` (R2 task 2.4) is supplied at deploy
  # time by the OIDC workflow via `--parameter-overrides "OpenRouterApiKey=${OPENROUTER_API_KEY}"`
  # from the TEST environment's secret store — never committed, never in CI config.
  # NOTE: DynamoDbEndpointUrl is LOCAL-ONLY — omitted here (same as prod) so the TEST
  # Lambda talks to real AWS DynamoDB (the `test_`-prefixed tables), not a local emulator.
]

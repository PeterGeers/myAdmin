# samconfig.toml — pinned SAM deploy config for the PreTokenGen Lambda (s5e).
#
# Makes `sam deploy` reproducible: the stack name, region, capabilities, and the
# fail-fast parameter_overrides live here instead of inline flags, so the CI workflow
# (deploy-sam-pretokengen.yml) and a manual `sam deploy --config-env <env>` produce the
# SAME stack. The Lambda + layer deploy to the DATA account (nonprofit-deploy /
# 506221081911, eu-west-1) via GitHub OIDC (NonprofitDeployRole). NO secrets here; the
# Cognito identifiers below are PUBLIC (account id / pool id).
#
# STACK NAMES (s5e footgun guard): `test` and `prod` pin DISTINCT stack names, so a deploy
# of one can never rename/replace the other's function/layer. Note the template's `Stage`
# param names the RESOURCES (`pretokengen-${Stage}`), NOT the stack — the stack is pinned
# here: `[test]` -> `test_pretokengen`, `[prod]` -> `pretokengen-prod`.
#
# NOTE (test-environment Phase 4): the TEST stack was historically named `pretokengen-data`
# and deliberately read the PROD `governance_projection` table (old ODx1/CE.3 rationale: the
# test POOL made it "test"). That is superseded — a TEST environment must be FULLY isolated,
# and a projection can legitimately deviate from prod over time, so TEST now reads its OWN
# `test_governance_projection` table (no shared projection across environments). The stack is
# also renamed to the `test_` convention (`test_pretokengen`). The old `pretokengen-data`
# stack is retired as a deliberate ops step at deploy time (deploy the new stack, re-attach
# the Cognito Pre-Token-Generation trigger on the myAdmin-test pool to the new function ARN,
# then delete the orphaned old stack).
#
# PROJECTION TABLE: `[test]` reads `test_governance_projection`, `[prod]` reads
# `governance_projection`. No environment shares a projection table.
#
# COGNITO (s5e / D5a): CognitoAccountId is the personal/identity account (344561557829) —
# SAME for both envs, because both the `myAdmin-test` and Pool A pools live there. Only the
# CognitoUserPoolId differs. These scope the AWS::Lambda::Permission that lets the pool's
# Pre-Token-Generation trigger invoke this Lambda cross-account.

version = 0.1

# --- TEST (data account 506221081911, eu-west-1; triggered from personal-acct myAdmin-test) ---
[test.deploy.parameters]
stack_name = "test-pretokengen"      # CFN stack names forbid underscores (TABLES/prefix keep test_); DISTINCT from prod
region = "eu-west-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = [
  "Stage=test",
  "Region=eu-west-1",
  # TEST reads its OWN projection — no shared projection with prod (a projection can deviate
  # over time). Populated operationally (local-Docker seed or a one-way PROD->TEST copy).
  "GovernanceProjectionTableName=test_governance_projection",
  "CognitoAccountId=344561557829",              # personal/identity account (D5a)
  "CognitoUserPoolId=eu-west-1_xyrlzfqbl",       # myAdmin-test pool
]

# --- PROD (data account 506221081911, eu-west-1; triggered from personal-acct Pool A) ---
[prod.deploy.parameters]
stack_name = "pretokengen-prod"      # DISTINCT from test
region = "eu-west-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
resolve_s3 = true
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = [
  "Stage=prod",
  "Region=eu-west-1",
  "GovernanceProjectionTableName=governance_projection",
  "CognitoAccountId=344561557829",              # personal/identity account (D5a)
  "CognitoUserPoolId=eu-west-1_Hdp40eWmu",       # Pool A (myAdmin)
]

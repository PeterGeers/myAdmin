[pytest]
# Self-contained pytest config for the module-plane shared auth layer (S2 / T8).
# Kept separate from backend/pytest.ini so sam/ tests never pull in the Flask
# plane's plugins/conftest (e.g. the DB connection guard) or backend/src imports.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --tb=short
markers =
    unit: fast, isolated unit test with no external dependencies (steering 34)
    e2e: end-to-end test against local DynamoDB (steering 34/42); skips when the container/endpoint is absent
    real_s3: HC6 integration test against REAL S3 (spec 14 task 1.4 T2/T3); opt-in via RUN_REAL_S3=1, skips otherwise and when the bucket is unreachable
    slow: test that takes > 10 seconds (steering 34)
filterwarnings =
    ignore::DeprecationWarning
